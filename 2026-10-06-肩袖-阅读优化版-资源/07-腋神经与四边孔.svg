<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1460" height="620" viewBox="0 0 1460 620" role="img" aria-label="Axillary nerve branching pathway — 腋神经分支通路"><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif} .soft{fill:#faf7ee;stroke:#d8d5c9;stroke-width:2}</style><defs><marker id="fig07-arrow-nerve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#c69014"/></marker></defs><rect width="100%" height="100%" fill="#fcfaf4"/><text x="34" y="43" fill="#253b36" font-size="26" font-weight="600" text-anchor="start" aria-label="Axillary nerve · branch map — 腋神经 · 分支关系"><tspan x="34" dy="0" lang="en">Axillary nerve · branch map</tspan><tspan x="34" dy="31" lang="zh-CN" font-size="23" font-weight="400" fill="#68726a">腋神经 · 分支关系</tspan></text><rect x="32" y="220" width="260" height="155" rx="12" class="soft"/><text x="52" y="253" fill="#315c8f" font-size="19" font-weight="600" text-anchor="start" aria-label="Posterior cord — 臂丛后束"><tspan x="52" dy="0" lang="en">Posterior cord</tspan><tspan x="52" dy="24" lang="zh-CN" font-size="16" font-weight="400" fill="#68726a">臂丛后束</tspan></text><text x="52" y="309" fill="#253b36" font-size="16" font-weight="400" text-anchor="start" aria-label="C5–C6 fibers — C5–C6 颈神经纤维"><tspan x="52" dy="0" lang="en">C5–C6 fibers</tspan><tspan x="52" dy="21" lang="zh-CN" font-size="14" font-weight="400" fill="#68726a">C5–C6 颈神经纤维</tspan></text><rect x="337" y="220" width="275" height="155" rx="12" class="soft"/><text x="357" y="253" fill="#315c8f" font-size="19" font-weight="600" text-anchor="start" aria-label="Quadrangular space — 四边孔"><tspan x="357" dy="0" lang="en">Quadrangular space</tspan><tspan x="357" dy="24" lang="zh-CN" font-size="16" font-weight="400" fill="#68726a">四边孔</tspan></text><text x="357" y="309" fill="#253b36" font-size="16" font-weight="400" text-anchor="start" aria-label="With posterior circumflex humeral artery — 伴旋肱后动脉"><tspan x="357" dy="0" lang="en">With posterior circumflex</tspan><tspan x="357" dy="21" lang="en">humeral artery</tspan><tspan x="357" dy="21" lang="zh-CN" font-size="14" font-weight="400" fill="#68726a">伴旋肱后动脉</tspan></text><path d="M294 297 L335 297" stroke="#c69014" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#fig07-arrow-nerve)"/><path d="M614 297 L650 297 L650 178 L686 178" stroke="#c69014" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#fig07-arrow-nerve)"/><path d="M650 297 L650 402 L686 402" stroke="#c69014" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#fig07-arrow-nerve)"/><rect x="688" y="110" width="735" height="155" rx="12" class="soft"/><text x="708" y="143" fill="#315c8f" font-size="19" font-weight="600" text-anchor="start" aria-label="Anterior branch — 前支"><tspan x="708" dy="0" lang="en">Anterior branch</tspan><tspan x="708" dy="24" lang="zh-CN" font-size="16" font-weight="400" fill="#68726a">前支</tspan></text><text x="708" y="199" fill="#253b36" font-size="16" font-weight="400" text-anchor="start" aria-label="Anterior and middle Deltoid — 三角肌前部与中部"><tspan x="708" dy="0" lang="en">Anterior and middle Deltoid</tspan><tspan x="708" dy="21" lang="zh-CN" font-size="14" font-weight="400" fill="#68726a">三角肌前部与中部</tspan></text><rect x="688" y="333" width="735" height="202" rx="12" class="soft"/><text x="708" y="366" fill="#315c8f" font-size="19" font-weight="600" text-anchor="start" aria-label="Posterior branch — 后支"><tspan x="708" dy="0" lang="en">Posterior branch</tspan><tspan x="708" dy="24" lang="zh-CN" font-size="16" font-weight="400" fill="#68726a">后支</tspan></text><text x="708" y="422" fill="#253b36" font-size="16" font-weight="400" text-anchor="start" aria-label="Teres minor and posterior Deltoid — 小圆肌与三角肌后部"><tspan x="708" dy="0" lang="en">Teres minor and posterior Deltoid</tspan><tspan x="708" dy="21" lang="zh-CN" font-size="14" font-weight="400" fill="#68726a">小圆肌与三角肌后部</tspan></text><text x="708" y="480" fill="#253b36" font-size="16" font-weight="400" text-anchor="start" aria-label="Continues as the superior lateral cutaneous nerve of the arm. — 延续为臂外上侧皮神经，支配上臂外上侧皮肤。"><tspan x="708" dy="0" lang="en">Continues as the superior lateral cutaneous nerve of the arm.</tspan><tspan x="708" dy="21" lang="zh-CN" font-size="14" font-weight="400" fill="#68726a">延续为臂外上侧皮神经，支配上臂外上侧皮肤。</tspan></text><text x="34" y="580" font-family="Arial, PingFang SC, sans-serif" font-size="16" fill="#52665b"><tspan x="34" lang="en">Branching patterns vary; a simplified common pattern is shown.</tspan><tspan x="34" dy="23" lang="zh-CN" font-size="14">分支方式存在个体差异；图示为常见关系的简化表达。</tspan></text></svg>