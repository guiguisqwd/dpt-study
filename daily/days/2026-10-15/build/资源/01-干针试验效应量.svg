<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="Hando 2026: what the results abstract reports — Hando 2026：结果摘要报告的效应量"><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style><defs></defs><rect width="100%" height="100%" fill="#fcfaf4"/><text class="fig-title" x="38" y="46" fill="#253b36" font-size="27" font-weight="700" aria-label="Hando 2026: what the results abstract reports — Hando 2026：结果摘要报告的效应量"><tspan x="38" dy="0" lang="en">Hando 2026: what the results abstract reports</tspan><tspan x="38" dy="32" lang="zh-CN" font-size="22" font-weight="400" fill="#68726a">Hando 2026：结果摘要报告的效应量</tspan></text><text x="38.0" y="116.0" font-size="15" fill="#6b706a" text-anchor="start" font-weight="400" aria-label="Each row compares PT + DN with one control group. Square = reported estimate; line = its 95% confidence interval. — 每一行是干针组（PT + DN）和一个对照组的比较。方块是报告的估计值，横线是 95% 置信区间。"><tspan x="38.0" dy="0" lang="en">Each row compares PT + DN with one control group. Square = reported estimate; line = its 95% confidence interval.</tspan><tspan x="38.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">每一行是干针组（PT + DN）和一个对照组的比较。方块是报告的估计值，横线是 95% 置信区间。</tspan></text><text x="38.0" y="182.0" font-size="19" fill="#253b36" text-anchor="start" font-weight="700" lang="en">Primary outcome: SPADI at 1 year</text><text x="38.0" y="205.0" font-size="16" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">主要结局：1 年时的 SPADI</text><text x="38.0" y="234.0" font-size="14" fill="#6b706a" text-anchor="start" font-weight="400" lang="en">Difference in points; lower SPADI = less pain and disability</text><text x="38.0" y="254.0" font-size="13" fill="#6b706a" text-anchor="start" font-weight="400" lang="zh-CN">分差；SPADI 越低，疼痛与功能障碍越轻</text><path d="M533.3,276 L533.3,438" fill="none" stroke="#b94334" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" /><text x="38.0" y="304.0" font-size="16" fill="#253b36" text-anchor="start" font-weight="700" lang="en">PT + DN vs PT</text><text x="38.0" y="324.0" font-size="14" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">干针组 对比 物理治疗组</text><text x="38.0" y="344.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="en">−7.51 (−16.57 to 1.54)</text><path d="M340.0,316 L551.3,316" fill="none" stroke="#253b36" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><path d="M340.0,308 L340.0,324 M551.3,308 L551.3,324" fill="none" stroke="#253b36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="436.7" y="307" width="18" height="18" fill="#365e91" stroke="#fff" stroke-width="1.5"/><text x="38.0" y="382.0" font-size="16" fill="#253b36" text-anchor="start" font-weight="700" lang="en">PT + DN vs PT + SDN</text><text x="38.0" y="402.0" font-size="14" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">干针组 对比 假干针组</text><text x="38.0" y="422.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="en">−9.85 (−18.98 to 0.73) *</text><path d="M311.9,394 L541.9,394" fill="none" stroke="#253b36" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><path d="M311.9,386 L311.9,402 M541.9,386 L541.9,402" fill="none" stroke="#253b36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="409.4" y="385" width="18" height="18" fill="#365e91" stroke="#fff" stroke-width="1.5"/><path d="M300,438 L650,438" fill="none" stroke="#253b36" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M300.0,438.0 L300.0,445.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="300.0" y="464.0" font-size="14" fill="#253b36" text-anchor="middle" font-weight="400" lang="en">−20</text><path d="M358.3,438.0 L358.3,445.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="358.3" y="464.0" font-size="14" fill="#253b36" text-anchor="middle" font-weight="400" lang="en">−15</text><path d="M416.7,438.0 L416.7,445.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="416.7" y="464.0" font-size="14" fill="#253b36" text-anchor="middle" font-weight="400" lang="en">−10</text><path d="M475.0,438.0 L475.0,445.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="475.0" y="464.0" font-size="14" fill="#253b36" text-anchor="middle" font-weight="400" lang="en">−5</text><path d="M533.3,438.0 L533.3,445.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="533.3" y="464.0" font-size="14" fill="#253b36" text-anchor="middle" font-weight="400" lang="en">0</text><path d="M591.7,438.0 L591.7,445.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="591.7" y="464.0" font-size="14" fill="#253b36" text-anchor="middle" font-weight="400" lang="en">+5</text><path d="M650.0,438.0 L650.0,445.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="650.0" y="464.0" font-size="14" fill="#253b36" text-anchor="middle" font-weight="400" lang="en">+10</text><text x="523.3" y="492.0" font-size="14" fill="#253b36" text-anchor="end" font-weight="700" lang="en">← favours PT + DN</text><text x="523.3" y="511.0" font-size="13" fill="#68726a" text-anchor="end" font-weight="400" lang="zh-CN">← 有利于干针组</text><text x="543.3" y="492.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="700" lang="en">favours control →</text><text x="543.3" y="511.0" font-size="13" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">有利于对照组 →</text><text x="720.0" y="182.0" font-size="19" fill="#253b36" text-anchor="start" font-weight="700" lang="en">Secondary outcome: PASS</text><text x="720.0" y="205.0" font-size="16" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">次要结局：患者可接受症状状态（PASS）</text><text x="720.0" y="234.0" font-size="14" fill="#6b706a" text-anchor="start" font-weight="400" lang="en">Absolute difference in percentage points of people who call their symptoms acceptable</text><text x="720.0" y="254.0" font-size="13" fill="#6b706a" text-anchor="start" font-weight="400" lang="zh-CN">认为症状可以接受的人所占比例的绝对差值（百分点）</text><path d="M990.0,276 L990.0,516" fill="none" stroke="#b94334" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" /><text x="720.0" y="304.0" font-size="16" fill="#253b36" text-anchor="start" font-weight="700" lang="en">6 months · vs PT</text><text x="720.0" y="324.0" font-size="14" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">6 个月 · 对比物理治疗组</text><text x="720.0" y="344.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="en">+34 (+14 to +55)</text><path d="M1074.0,316 L1320.0,316" fill="none" stroke="#253b36" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><path d="M1074.0,308 L1074.0,324 M1320.0,308 L1320.0,324" fill="none" stroke="#253b36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="1185.0" y="307" width="18" height="18" fill="#365e91" stroke="#fff" stroke-width="1.5"/><text x="720.0" y="382.0" font-size="16" fill="#253b36" text-anchor="start" font-weight="700" lang="en">6 months · vs PT + SDN</text><text x="720.0" y="402.0" font-size="14" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">6 个月 · 对比假干针组</text><text x="720.0" y="422.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="en">+24 (+4 to +45)</text><path d="M1014.0,394 L1260.0,394" fill="none" stroke="#253b36" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><path d="M1014.0,386 L1014.0,402 M1260.0,386 L1260.0,402" fill="none" stroke="#253b36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="1125.0" y="385" width="18" height="18" fill="#365e91" stroke="#fff" stroke-width="1.5"/><text x="720.0" y="460.0" font-size="16" fill="#253b36" text-anchor="start" font-weight="700" lang="en">1 year · vs PT + SDN</text><text x="720.0" y="480.0" font-size="14" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">1 年 · 对比假干针组</text><text x="720.0" y="500.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="en">+28 (+7 to +49)</text><path d="M1032.0,472 L1284.0,472" fill="none" stroke="#253b36" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><path d="M1032.0,464 L1032.0,480 M1284.0,464 L1284.0,480" fill="none" stroke="#253b36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="1149.0" y="463" width="18" height="18" fill="#365e91" stroke="#fff" stroke-width="1.5"/><path d="M930,516 L1350,516" fill="none" stroke="#253b36" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M930.0,516.0 L930.0,523.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="930.0" y="542.0" font-size="14" fill="#253b36" text-anchor="middle" font-weight="400" lang="en">−10</text><path d="M990.0,516.0 L990.0,523.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="990.0" y="542.0" font-size="14" fill="#253b36" text-anchor="middle" font-weight="400" lang="en">0</text><path d="M1050.0,516.0 L1050.0,523.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="1050.0" y="542.0" font-size="14" fill="#253b36" text-anchor="middle" font-weight="400" lang="en">+10</text><path d="M1110.0,516.0 L1110.0,523.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="1110.0" y="542.0" font-size="14" fill="#253b36" text-anchor="middle" font-weight="400" lang="en">+20</text><path d="M1170.0,516.0 L1170.0,523.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="1170.0" y="542.0" font-size="14" fill="#253b36" text-anchor="middle" font-weight="400" lang="en">+30</text><path d="M1230.0,516.0 L1230.0,523.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="1230.0" y="542.0" font-size="14" fill="#253b36" text-anchor="middle" font-weight="400" lang="en">+40</text><path d="M1290.0,516.0 L1290.0,523.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="1290.0" y="542.0" font-size="14" fill="#253b36" text-anchor="middle" font-weight="400" lang="en">+50</text><path d="M1350.0,516.0 L1350.0,523.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="1350.0" y="542.0" font-size="14" fill="#253b36" text-anchor="middle" font-weight="400" lang="en">+60</text><text x="980.0" y="570.0" font-size="14" fill="#253b36" text-anchor="end" font-weight="700" lang="en">← favours control</text><text x="980.0" y="589.0" font-size="13" fill="#68726a" text-anchor="end" font-weight="400" lang="zh-CN">← 有利于对照组</text><text x="1000.0" y="570.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="700" lang="en">favours PT + DN →</text><text x="1000.0" y="589.0" font-size="13" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">有利于干针组 →</text><path d="M38,618 L1362,618" fill="none" stroke="#d8d2c2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="38.0" y="644.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="en">Both SPADI intervals include 0: no statistically significant difference on the primary outcome. That is not proof that the groups are equal.</text><text x="38.0" y="665.0" font-size="13" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">SPADI 的两个区间都包含 0：主要结局没有统计学显著差异；这不等于证明两组效果相同。</text><text x="38.0" y="692.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="en">* As printed: −9.85 lies 9.13 points above the lower limit and 10.58 below the upper limit, so the interval is not centred on the estimate. Kept as printed (see text).</text><text x="38.0" y="713.0" font-size="13" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">* 按原文照录：−9.85 距下限 9.13 分，距上限 10.58 分，区间并不以估计值为中心。数字未改（见正文）。</text><text x="38.0" y="740.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="en">The three PASS intervals lie above 0, but these are secondary outcomes; whether the authors adjusted for multiple comparisons is not verified.</text><text x="38.0" y="761.0" font-size="13" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">PASS 的三个区间都在 0 以上，但这些是次要结局；作者是否做了多重比较校正尚未核实。</text><text x="38.0" y="788.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="en">Not plotted: the odds ratio for further shoulder care, 0.35 (95% CI 0.13–0.95), because the abstract does not say which group is the reference.</text><text x="38.0" y="809.0" font-size="13" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">没有画出：再次因肩部就医的比值比 0.35（95% CI 0.13–0.95），因为摘要没有说明参照组是哪一组。</text><text class="fig-foot" x="38" y="866" font-size="13" fill="#6b706a"><tspan x="38" dy="0" lang="en">Plotted from the numbers reported in the results abstract (PubMed 41476428), via the paper record; nothing estimated.</tspan><tspan x="38" dy="17" lang="zh-CN">按结果摘要（PubMed 41476428）报告的数字绘制（取自论文记录），没有自行估算。</tspan></text></svg>