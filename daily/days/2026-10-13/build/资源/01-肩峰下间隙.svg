<tspan x="960.0" dy="0" lang="en">Humeral head: the floor of the space</tspan><tspan x="960.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">肱骨头：间隙的底</tspan></text><path d="M556.0,470.0 L952.0,535.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="960.0" y="540.0" font-size="15" fill="#253b36" text-anchor="start" font-weight="600" aria-label="Glenoid cavity of the scapula — 肩胛骨关节盂"><tspan x="960.0" dy="0" lang="en">Glenoid cavity of the scapula</tspan><tspan x="960.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">肩胛骨关节盂</tspan></text><path d="M780.0,342.0 L952.0,375.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="960.0" y="380.0" font-size="15" fill="#253b36" text-anchor="start" font-weight="600" aria-label="Scapula: floor of the supraspinous fossa — 肩胛骨：冈上窝底"><tspan x="960.0" dy="0" lang="en">Scapula: floor of the supraspinous fossa</tspan><tspan x="960.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">肩胛骨：冈上窝底</tspan></text><path d="M282.0,360.0 L268.0,325.0" fill="none" stroke="#365e91" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="40.0" y="330.0" font-size="15" fill="#365e91" text-anchor="start" font-weight="600" aria-label="Subacromial (subdeltoid) bursa — 肩峰下（三角肌下）滑囊"><tspan x="40.0" dy="0" lang="en">Subacromial (subdeltoid) bursa</tspan><tspan x="40.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">肩峰下（三角肌下）滑囊</tspan></text><path d="M190.0,480.0 L180.0,475.0" fill="none" stroke="#6b706a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="40.0" y="480.0" font-size="15" fill="#6b706a" text-anchor="start" font-weight="600" aria-label="Deltoid (dashed) — 三角肌（虚线）"><tspan x="40.0" dy="0" lang="en">Deltoid (dashed)</tspan><tspan x="40.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">三角肌（虚线）</tspan></text><path d="M340.0,372.0 L266.0,635.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="40.0" y="640.0" font-size="15" fill="#253b36" text-anchor="start" font-weight="600" aria-label="Greater tubercle, superior facet — 大结节上小面"><tspan x="40.0" dy="0" lang="en">Greater tubercle, superior facet</tspan><tspan x="40.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">大结节上小面</tspan></text><text x="960.0" y="640.0" font-size="14" fill="#6b706a" text-anchor="start" font-weight="400" aria-label="About 1–1.5 cm high; it narrows as the arm is raised. — 这个间隙高约 1–1.5 cm，抬臂时会变窄。"><tspan x="960.0" dy="0" lang="en">About 1–1.5 cm high; it narrows as the arm is raised.</tspan><tspan x="960.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">这个间隙高约 1–1.5 cm，抬臂时会变窄。</tspan></text><text x="960.0" y="690.0" font-size="14" fill="#6b706a" text-anchor="start" font-weight="400" aria-label="Source: StatPearls, Shoulder Impingement Syndrome. — 依据：StatPearls「肩峰下撞击综合征」。"><tspan x="960.0" dy="0" lang="en">Source: StatPearls, Shoulder Impingement Syndrome.</tspan><tspan x="960.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">依据：StatPearls「肩峰下撞击综合征」。</tspan></text><text class="fig-foot" x="38" y="826" font-size="13" fill="#6b706a"><tspan x="38" dy="0" lang="en">Schematic; pathway and layers are simplified.</tspan><tspan x="38" dy="17" lang="zh-CN">解剖示意；走行与层次经过简化。</tspan></text></svg>