Z" fill="#ece4d4" stroke="#a59b88" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><path d="M250,214 C258,170 292,150 334,148 C376,148 406,172 410,222 C402,300 380,370 344,438 C338,446 330,446 326,438 C296,370 264,300 250,214 Z" fill="none" stroke="#a59b88" stroke-width="0.80" stroke-linecap="round" stroke-linejoin="round" opacity="0.32" transform="translate(1.4,1.0)"/><path d="M286,330 C304,312 362,312 380,330 C376,372 360,408 344,432 C336,442 328,442 322,432 C306,408 290,372 286,330 Z" fill="#9fb9de" fill-opacity="0.75" stroke="#365e91" stroke-width="2.2"/><path d="M246,226 C238,300 246,380 256,460 C262,520 266,580 270,640 C272,680 274,720 278,760 " fill="none" stroke="#253b36" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M396,760 C396,720 398,680 400,646 C404,590 398,520 394,460 C390,380 404,300 414,232 " fill="none" stroke="#253b36" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M246,226 C252,176 288,146 336,144 C380,142 414,170 414,232" fill="none" stroke="#253b36" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M278,760 L396,760" fill="none" stroke="#253b36" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" /><path d="M300,170 C322,160 352,158 384,166" fill="none" stroke="#3A3A3A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" /><path d="M268,640 C300,652 360,654 398,642" fill="none" stroke="#b8ae9c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M384.0,166.0 L470.0,128.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="476.0" y="124.0" font-size="15" fill="#253b36" text-anchor="start" font-weight="600" aria-label="Acromion (felt under the skin) — 肩峰（皮下可触及）"><tspan x="476.0" dy="0" lang="en">Acromion (felt under the skin)</tspan><tspan x="476.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">肩峰（皮下可触及）</tspan></text><path d="M390.0,220.0 L520.0,236.0" fill="none" stroke="#8a7f6c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="526.0" y="232.0" font-size="15" fill="#6b604c" text-anchor="start" font-weight="600" aria-label="Deltoid — 三角肌"><tspan x="526.0" dy="0" lang="en">Deltoid</tspan><tspan x="526.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">三角肌</tspan></text><path d="M372.0,372.0 L520.0,372.0" fill="none" stroke="#365e91" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="526.0" y="360.0" font-size="17" fill="#365e91" text-anchor="start" font-weight="700" aria-label="Regimental badge area — 徽章区"><tspan x="526.0" dy="0" lang="en">Regimental badge area</tspan><tspan x="526.0" dy="21" lang="zh-CN" font-size="15" font-weight="400" fill="#68726a">徽章区</tspan></text><text x="526.0" y="410.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" aria-label="Skin over the inferior part of Deltoid — 三角肌下部表面的皮肤"><tspan x="526.0" dy="0" lang="en">Skin over the inferior part of Deltoid</tspan><tspan x="526.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">三角肌下部表面的皮肤</tspan></text><path d="M344.0,438.0 L520.0,470.0" fill="none" stroke="#8a7f6c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="526.0" y="466.0" font-size="14" fill="#6b604c" text-anchor="start" font-weight="400" aria-label="Deltoid tuberosity: Deltoid inserts here — 三角肌粗隆：三角肌止于此"><tspan x="526.0" dy="0" lang="en">Deltoid tuberosity: Deltoid inserts here</tspan><tspan x="526.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">三角肌粗隆：三角肌止于此</tspan></text><text x="200.0" y="690.0" font-size="14" fill="#6b706a" text-anchor="end" font-weight="400" lang="en">Posterior</text><text x="200.0" y="708.0" font-size="13" fill="#6b706a" text-anchor="end" font-weight="400" lang="zh-CN">后</text><text x="470.0" y="690.0" font-size="14" fill="#6b706a" text-anchor="start" font-weight="400" lang="en">Anterior</text><text x="470.0" y="708.0" font-size="13" fill="#6b706a" text-anchor="start" font-weight="400" lang="zh-CN">前</text><text x="410.0" y="650.0" font-size="13" fill="#6b706a" text-anchor="start" font-weight="400" lang="en">Elbow</text><text x="452.0" y="650.0" font-size="12" fill="#6b706a" text-anchor="start" font-weight="400" lang="zh-CN">肘</text></g><rect x="820" y="150" width="548" height="178" rx="8" fill="#eef3fa" stroke="#365e91" stroke-width="1.8"/><text x="834.0" y="176.0" font-size="16" fill="#253b36" text-anchor="start" font-weight="700" lang="en">Sensory: a nerve territory, not a dermatome</text><text x="834.0" y="198.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="en">The superior lateral cutaneous nerve of the arm is a cutaneous</text><text x="834.0" y="220.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="en">branch of the axillary nerve: the posterior branch continues as it.</text><text x="834.0" y="242.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="en">Peripheral nerve territory ≠ dermatome. The lateral upper arm</text><text x="834.0" y="264.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="en">overlaps the C5 dermatome.</text><text x="834.0" y="286.0" font-size="13" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">感觉：这是周围神经分布区，不是皮节。腋神经后支延续为臂外上侧皮神经。</text><text x="834.0" y="308.0" font-size="13" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">周围神经分布区不等同于皮节；上臂外侧区域与 C5 皮节重叠。</text><rect x="820" y="348" width="548" height="140" rx="8" fill="#f1f7ef" stroke="#4f8a4a" stroke-width="1.8"/><text x="834.0" y="374.0" font-size="16" fill="#253b36" text-anchor="start" font-weight="700" lang="en">Key myotomes · C5 and C6</text><text x="834.0" y="396.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="en">C5: shoulder abduction. C6: elbow flexion and wrist extension.</text><text x="834.0" y="418.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="en">These movements receive overlapping segmental contributions.</text><text x="834.0" y="440.0" font-size="13" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">代表性肌节：C5 肩外展；C6 屈肘和伸腕。</text><text x="834.0" y="462.0" font-size="13" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">这些动作通常接受相邻神经节段的共同支配。</text><rect x="820" y="508" width="548" height="140" rx="8" fill="#fbefed" stroke="#b94334" stroke-width="1.8"/><text x="834.0" y="534.0" font-size="16" fill="#253b36" text-anchor="start" font-weight="700" lang="en">Axillary nerve injury</text><text x="834.0" y="556.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="en">Deltoid weakness and badge-area sensory loss.</text><text x="834.0" y="578.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="en">Risk: a surgical-neck fracture or an anterior shoulder dislocation.</text><text x="834.0" y="600.0" font-size="13" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">腋神经损伤：三角肌无力和徽章区感觉减退。</text><text x="834.0" y="622.0" font-size="13" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">风险因素：肱骨外科颈骨折或肩关节前脱位。</text><text x="820.0" y="686.0" font-size="13" fill="#6b706a" text-anchor="start" font-weight="400" lang="en">Facts: this week&#x27;s chapter (figure 14 and the axillary nerve paragraph).</text><text x="820.0" y="705.0" font-size="13" fill="#6b706a" text-anchor="start" font-weight="400" lang="en">Where the badge area lies: TeachMeAnatomy, The Axillary Nerve.</text><text x="820.0" y="724.0" font-size="12" fill="#6b706a" text-anchor="start" font-weight="400" lang="zh-CN">依据：本周章节（图 14 与腋神经一段）；徽章区位置：TeachMeAnatomy「腋神经」。</text><text class="fig-foot" x="38" y="866" font-size="13" fill="#6b706a"><tspan x="38" dy="0" lang="en">Schematic; the outline of the badge area is drawn approximately.</tspan><tspan x="38" dy="17" lang="zh-CN">示意图；徽章区的边界为大致画法。</tspan></text></svg>