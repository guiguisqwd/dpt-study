dl.fields dt{color:var(--muted);font-size:12.5px;padding-top:2px}
dl.fields dd{margin:0;min-width:0;overflow-wrap:anywhere}
dd.safe{color:var(--warn)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:9px;padding:10px 16px;font:600 14px var(--font-body);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.again{color:var(--warn);border-color:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.group{margin:0 0 14px}
.group>summary{cursor:pointer;font-weight:600;padding:8px 2px;list-style:none;display:flex;justify-content:space-between;gap:10px}
.group>summary::-webkit-details-marker{display:none}
.group>summary span{color:var(--muted);font-weight:400;font-size:13px;font-family:var(--font-num)}
.rows{display:grid;gap:8px}
.row{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 14px}
.row>summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.row>summary::-webkit-details-marker{display:none}

.row small{color:var(--muted)}

.pill.due{background:var(--warn-soft);color:var(--warn)}
.row dl{margin-top:10px}
.foot{font-size:12px;color:var(--muted);margin-top:30px;border-top:1px solid var(--rule);padding-top:12px}

<script>
(function(){
var CARDS=JSON.parse(document.getElementById('cards').textContent);
var INT=[1,3,7,14,30,60], KEY='dpt-cards-v1', DEADLINE='2026-12-23';
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(s,n){var p=s.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return iso(d);}
var TODAY=iso(new Date());
var state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){state={};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function st(c){return state[c.id]||{step:0,next:addDays(c.learned,1)};}
function isDue(c){return c.learned<=TODAY && st(c).next<=TODAY;}
function esc(s){return String(s).replace(/[&<>"]/g,function(ch){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch];});}
function fields(c){return '<dl class="fields">'+c.fields.filter(function(f){return f[1];}).map(function(f){return '<dt>'+esc(f[0])+'</dt><dd'+(f[0]==='安全提示'&&f[1]!=='—'?' class="safe"':'')+'>'+esc(f[1])+'</dd>';}).join('')+'</dl>';}
var learned=CARDS.filter(function(c){return c.learned<=TODAY;});
function stats(){
  var a=learned.filter(function(c){return c.type==='acu';}).length, m=learned.filter(function(c){return c.type==='mus';}).length;
  document.getElementById('s-acu').textContent=a;document.getElementById('b-acu').style.width=Math.min(100,a/362*100)+'%';
  document.getElementById('s-mus').textContent=m;document.getElementById('b-mus').style.width=Math.min(100,m/157*100)+'%';
  document.getElementById('s-due').textContent=learned.filter(isDue).length;
  var p=DEADLINE.split('-'),t=TODAY.split('-');var left=Math.round((new Date(+p[0],+p[1]-1,+p[2])-new Date(+t[0],+t[1]-1,+t[2]))/864e5);
  document.getElementById('s-left').textContent=Math.max(0,left);
  document.getElementById('today-line').textContent='DPT 基础 · 今天 '+TODAY+' · 12 月 23 日前背完十四经穴和常用肌肉';}
var view='due', q='', shown=false, queue=null;
function match(c){if(!q)return true;var s=(c.title+' '+c.sub+' '+c.meridian+' '+c.region).toLowerCase();return s.indexOf(q)>=0;}
function renderDue(){
  if(!queue)queue=learned.filter(isDue).filter(match).map(function(c){return c.id;});
  var el=document.getElementById('view');
  if(!queue.length){el.innerHTML='<div class="study empty"><p><b>今天的复习完成了。</b></p><p>可以切到“按经络”或“按部位”，把还不熟的再过一遍。</p></div>';return;}
  var c=CARDS.filter(function(x){return x.id===queue[0];})[0], s=st(c);
  el.innerHTML='<div class="study" aria-live="polite"><div class="meta"><span>'+(c.type==='acu'?'穴位 · '+esc(c.meridian):'肌肉 · '+esc(c.region))+'</span><span>还剩 '+queue.length+' 张 · 第 '+(s.step+1)+' 档</span></div>'+
   '<h2>'+esc(c.title)+'</h2>'+(c.type==='mus'&&shown?'<p class="sub">'+esc(c.sub)+'</p>':'<p class="sub">&nbsp;</p>')+
   '<div class="ask">先说出来：'+esc(c.ask)+'</div>'+(shown?fields(c):'')+
   '<div class="actions">'+(shown?'<button class="btn again" data-act="again" type="button">没记住</button><button class="btn primary" data-act="know" type="button">记住了</button>':'<button class="btn primary" data-act="show" type="button">显示答案</button>')+'</div></div>';}
function group(key){
  var el=document.getElementById('view'), groups={}, order=[];
  learned.filter(match).forEach(function(c){var k=key==='all'?c.learned:(key==='meridian'?(c.type==='acu'?c.meridian:'肌肉'):c.region);if(!groups[k]){groups[k]=[];order.push(k);}groups[k].push(c);});
  if(key==='all')order.sort().reverse();
  if(!order.length){el.innerHTML='<div class="study empty">没有找到匹配的卡片。</div>';return;}
  el.innerHTML=order.map(function(k){var due=groups[k].filter(isDue).length;
    return '<details class="group" open><summary>'+esc(k)+'<span>'+groups[k].length+' 张'+(due?' · '+due+' 张待复习':'')+'</span></summary><div class="rows">'+
    groups[k].map(function(c){var s=st(c);return '<details class="row"><summary><b>'+esc(c.title)+'</b><small>'+esc(c.type==='acu'?c.meridian:c.sub)+'</small><span class="pill'+(isDue(c)?' due':'')+'">'+(isDue(c)?'今天复习':'下次 '+s.next.slice(5))+'</span></summary>'+fields(c)+'</details>';}).join('')+'</div></details>';}).join('');}
function render(){stats();if(view==='due')renderDue();else group(view);}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-view]');if(t){view=t.dataset.view;document.querySelectorAll('[data-view]').forEach(function(b){b.setAttribute('aria-pressed',b===t?'true':'false');});queue=null;shown=false;render();return;}
  var a=e.target.closest('[data-act]');if(!a)return;var id=queue&&queue[0];if(!id)return;var c=CARDS.filter(function(x){return x.id===id;})[0];
  if(a.dataset.act==='show'){shown=true;render();return;}
  var s=st(c);
  if(a.dataset.act==='know'){var step=Math.min(s.step+1,INT.length-1);state[id]={step:step,next:addDays(TODAY,INT[step])};queue.shift();}
  else{state[id]={step:0,next:addDays(TODAY,1)};queue.push(queue.shift());if(queue.length===1){}}
  if(a.dataset.act==='again'&&queue.length>1){}
  save();shown=false;render();});
document.getElementById('q').addEventListener('input',function(e){q=e.target.value.trim().toLowerCase();queue=null;shown=false;render();});
render();
})();
</script>
