tspan></text><path d="M154 458 L255 397 L315 369" stroke="#6f7972" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="34" y="460" fill="#253b36" font-size="18" font-weight="600" text-anchor="start" aria-label="Scapular spine — 肩胛冈"><tspan x="34" dy="0" lang="en">Scapular spine</tspan><tspan x="34" dy="23" lang="zh-CN" font-size="15" font-weight="400" fill="#68726a">肩胛冈</tspan></text><rect x="810" y="153" width="610" height="150" rx="13" class="soft"/><text x="834" y="185" fill="#253b36" font-size="21" font-weight="600" text-anchor="start" aria-label="1  Through the suprascapular notch — 穿过肩胛上切迹"><tspan x="834" dy="0" lang="en">1  Through the suprascapular notch</tspan><tspan x="834" dy="26" lang="zh-CN" font-size="18" font-weight="400" fill="#68726a">穿过肩胛上切迹</tspan></text><text x="834" y="244" fill="#253b36" font-size="17" font-weight="400" text-anchor="start" aria-label="The nerve passes beneath the superior transverse scapular ligament. — "><tspan x="834" dy="0" lang="en">The nerve passes beneath the superior</tspan><tspan x="834" dy="22" lang="en">transverse scapular ligament.</tspan></text><text x="834" y="289" fill="#68726a" font-size="16" font-weight="400" text-anchor="start" aria-label="神经从肩胛上横韧带下方经过。 — "><tspan x="834" dy="0" lang="en">神经从肩胛上横韧带下方经过。</tspan></text><rect x="810" y="318" width="610" height="150" rx="13" class="soft"/><text x="834" y="350" fill="#253b36" font-size="21" font-weight="600" text-anchor="start" aria-label="2  Across the supraspinous fossa — 横过冈上窝"><tspan x="834" dy="0" lang="en">2  Across the supraspinous fossa</tspan><tspan x="834" dy="26" lang="zh-CN" font-size="18" font-weight="400" fill="#68726a">横过冈上窝</tspan></text><text x="834" y="409" fill="#253b36" font-size="17" font-weight="400" text-anchor="start" aria-label="Motor branches enter the deep surface of Supraspinatus. — "><tspan x="834" dy="0" lang="en">Motor branches enter the deep surface</tspan><tspan x="834" dy="22" lang="en">of Supraspinatus.</tspan></text><text x="834" y="454" fill="#68726a" font-size="16" font-weight="400" text-anchor="start" aria-label="运动支进入冈上肌深面。 — "><tspan x="834" dy="0" lang="en">运动支进入冈上肌深面。</tspan></text><rect x="810" y="483" width="610" height="150" rx="13" class="soft"/><text x="834" y="515" fill="#253b36" font-size="21" font-weight="600" text-anchor="start" aria-label="3  Around the spinoglenoid notch — 绕过冈盂切迹"><tspan x="834" dy="0" lang="en">3  Around the spinoglenoid notch</tspan><tspan x="834" dy="26" lang="zh-CN" font-size="18" font-weight="400" fill="#68726a">绕过冈盂切迹</tspan></text><text x="834" y="574" fill="#253b36" font-size="17" font-weight="400" text-anchor="start" aria-label="The nerve turns around the lateral end of the scapular spine. — "><tspan x="834" dy="0" lang="en">The nerve turns around the lateral end</tspan><tspan x="834" dy="22" lang="en">of the scapular spine.</tspan></text><text x="834" y="619" fill="#68726a" font-size="16" font-weight="400" text-anchor="start" aria-label="神经绕过肩胛冈的外侧端。 — "><tspan x="834" dy="0" lang="en">神经绕过肩胛冈的外侧端。</tspan></text><rect x="810" y="648" width="610" height="150" rx="13" class="soft"/><text x="834" y="680" fill="#253b36" font-size="21" font-weight="600" text-anchor="start" aria-label="4  Into the infraspinous fossa — 进入冈下窝"><tspan x="834" dy="0" lang="en">4  Into the infraspinous fossa</tspan><tspan x="834" dy="26" lang="zh-CN" font-size="18" font-weight="400" fill="#68726a">进入冈下窝</tspan></text><text x="834" y="739" fill="#253b36" font-size="17" font-weight="400" text-anchor="start" aria-label="Motor branches enter the deep surface of Infraspinatus. — "><tspan x="834" dy="0" lang="en">Motor branches enter the deep surface</tspan><tspan x="834" dy="22" lang="en">of Infraspinatus.</tspan></text><text x="834" y="784" fill="#68726a" font-size="16" font-weight="400" text-anchor="start" aria-label="运动支进入冈下肌深面。 — "><tspan x="834" dy="0" lang="en">运动支进入冈下肌深面。</tspan></text><text x="40" y="999" fill="#253b36" font-size="20" font-weight="600" text-anchor="start" aria-label="From the superior trunk (C5–C6) → beneath the ligament → Supraspinatus → around the spine → Infraspinatus. — 从臂丛上干（C5–C6）发出 → 韧带下方 → 冈上肌 → 绕过肩胛冈外侧 → 冈下肌。"><tspan x="40" dy="0" lang="en">From the superior trunk (C5–C6) → beneath the ligament → Supraspinatus → around the spine → Infraspinatus.</tspan><tspan x="40" dy="25" lang="zh-CN" font-size="17" font-weight="400" fill="#68726a">从臂丛上干（C5–C6）发出 → 韧带下方 → 冈上肌 → 绕过肩胛冈外侧 → 冈下肌。</tspan></text><text x="40" y="1095" fill="#253b36" font-size="15" font-weight="400" text-anchor="start" aria-label="Schematic; pathway and layers are simplified. — 解剖示意；走行与层次经过简化。"><tspan x="40" dy="0" lang="en">Schematic; pathway and layers are simplified.</tspan><tspan x="40" dy="20" lang="zh-CN" font-size="14" font-weight="400" fill="#68726a">解剖示意；走行与层次经过简化。</tspan></text></svg>