 — 后面观"><tspan x="12" dy="0" lang="en">Posterior view</tspan><tspan x="12" dy="15" font-size="11" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">后面观</tspan></text><path d="M12,257 L263,257" stroke="#d0d9cf" stroke-width="1" /><text x="12" y="278" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#263c37" font-weight="bold" text-anchor="start" aria-label="O  Origin — 起点"><tspan x="12" dy="0" lang="en">O  Origin</tspan><tspan x="12" dy="17" font-size="13" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">起点</tspan></text><text x="12" y="316" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#263c37" font-weight="normal" text-anchor="start" aria-label="Infraspinous fossa&#10;of scapula — 肩胛骨冈下窝"><tspan x="12" dy="0" lang="en">Infraspinous fossa</tspan><tspan x="12" dy="17" lang="en">of scapula</tspan><tspan x="12" dy="17" font-size="13" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">肩胛骨冈下窝</tspan></text><text x="12" y="374" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#865b26" font-weight="bold" text-anchor="start" aria-label="I  Insertion — 止点"><tspan x="12" dy="0" lang="en">I  Insertion</tspan><tspan x="12" dy="17" font-size="13" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">止点</tspan></text><text x="12" y="411" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#865b26" font-weight="normal" text-anchor="start" aria-label="Middle facet of the&#10;greater tubercle of humerus — 肱骨大结节中小面"><tspan x="12" dy="0" lang="en">Middle facet of the</tspan><tspan x="12" dy="16" lang="en">greater tubercle of humerus</tspan><tspan x="12" dy="16" font-size="12" font-weight="normal" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" lang="zh-CN">肱骨大结节中小面</tspan></text><desc>Dashed green area: representative origin region. Gold area: insertion. Dashed arrow: origin-to-insertion attachment map, not a force vector. 起点与止点是附着区域，图中范围为示意；虚线箭头表示起点到止点的附着关系，并非力矢量。</desc></svg>
