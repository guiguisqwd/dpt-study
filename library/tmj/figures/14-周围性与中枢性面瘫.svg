<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1280" viewBox="0 0 1900 1280" role="img" aria-label="Facial palsy: peripheral or central — 面瘫：周围性还是中枢性"><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style><defs><marker id="fig14-m6b6458" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6458"/></marker><marker id="fig14-mc69014" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c69014"/></marker></defs><rect width="100%" height="100%" fill="#fcfaf4"/><text class="fig-title" x="38" y="46" fill="#253b36" font-size="27" font-weight="700" aria-label="Facial palsy: peripheral or central — 面瘫：周围性还是中枢性"><tspan x="38" dy="0" lang="en">Facial palsy: peripheral or central</tspan><tspan x="38" dy="32" lang="zh-CN" font-size="22" font-weight="400" fill="#68726a">面瘫：周围性还是中枢性</tspan></text><text x="950.0" y="150.0" font-size="17" fill="#253b36" text-anchor="middle" font-weight="700" aria-label="Why the forehead is spared in a central lesion — 中枢性病变为什么不累及前额"><tspan x="950.0" dy="0" lang="en">Why the forehead is spared in a central lesion</tspan><tspan x="950.0" dy="21" lang="zh-CN" font-size="15" font-weight="400" fill="#68726a">中枢性病变为什么不累及前额</tspan></text><rect x="700" y="200" width="200" height="64" rx="8" fill="#fffdf7" stroke="#253b36" stroke-width="1.6"/><text x="800.0" y="230.0" font-size="13" fill="#253b36" text-anchor="middle" font-weight="700" aria-label="Right motor cortex — 右侧运动皮质"><tspan x="800.0" dy="0" lang="en">Right motor cortex</tspan><tspan x="800.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">右侧运动皮质</tspan></text><rect x="1000" y="200" width="200" height="64" rx="8" fill="#fffdf7" stroke="#253b36" stroke-width="1.6"/><text x="1100.0" y="230.0" font-size="13" fill="#253b36" text-anchor="middle" font-weight="700" aria-label="Left motor cortex — 左侧运动皮质"><tspan x="1100.0" dy="0" lang="en">Left motor cortex</tspan><tspan x="1100.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">左侧运动皮质</tspan></text><rect x="700" y="520" width="230" height="64" rx="8" fill="#fffdf7" stroke="#c69014" stroke-width="1.6"/><text x="815.0" y="550.0" font-size="13" fill="#c69014" text-anchor="middle" font-weight="700" aria-label="Upper part of the nucleus — 面神经核上部"><tspan x="815.0" dy="0" lang="en">Upper part of the nucleus</tspan><tspan x="815.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">面神经核上部</tspan></text><rect x="700" y="600" width="230" height="64" rx="8" fill="#fffdf7" stroke="#c69014" stroke-width="1.6"/><text x="815.0" y="630.0" font-size="13" fill="#c69014" text-anchor="middle" font-weight="700" aria-label="Lower part of the nucleus — 面神经核下部"><tspan x="815.0" dy="0" lang="en">Lower part of the nucleus</tspan><tspan x="815.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">面神经核下部</tspan></text><text x="686.0" y="588.0" font-size="13" fill="#8a640e" text-anchor="end" font-weight="700" aria-label="Right facial nucleus (pons) — 右侧面神经核（脑桥）"><tspan x="686.0" dy="0" lang="en">Right facial nucleus (pons)</tspan><tspan x="686.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">右侧面神经核（脑桥）</tspan></text><path d="M790.0,264.0 L790.0,518.0" fill="none" stroke="#6b6458" stroke-width="3" stroke-linecap="round" marker-end="url(#fig14-m6b6458)"/><path d="M1070.0,264.0 C1060.0,286.7 1038.3,357.0 1010.0,400.0 C981.7,443.0 918.3,501.7 900.0,522.0" fill="none" stroke="#6b6458" stroke-width="3" stroke-linecap="round" marker-end="url(#fig14-m6b6458)"/><path d="M1130.0,264.0 C1123.3,300.0 1123.0,418.7 1090.0,480.0 C1057.0,541.3 958.3,606.7 932.0,632.0" fill="none" stroke="#6b6458" stroke-width="3" stroke-linecap="round" marker-end="url(#fig14-m6b6458)"/><rect x="700" y="800" width="230" height="56" rx="8" fill="#fffdf7" stroke="#c69014" stroke-width="1.6"/><text x="815.0" y="826.0" font-size="13" fill="#c69014" text-anchor="middle" font-weight="700" aria-label="Right facial nerve — 右侧面神经"><tspan x="815.0" dy="0" lang="en">Right facial nerve</tspan><tspan x="815.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">右侧面神经</tspan></text><path d="M815.0,664.0 L815.0,798.0" fill="none" stroke="#c69014" stroke-width="4" stroke-linecap="round" marker-end="url(#fig14-mc69014)"/><rect x="640" y="940" width="170" height="56" rx="8" fill="#fffdf7" stroke="#253b36" stroke-width="1.6"/><text x="725.0" y="966.0" font-size="13" fill="#253b36" text-anchor="middle" font-weight="700" aria-label="Right forehead and eye — 右侧前额和眼"><tspan x="725.0" dy="0" lang="en">Right forehead and eye</tspan><tspan x="725.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">右侧前额和眼</tspan></text><rect x="830" y="940" width="170" height="56" rx="8" fill="#fffdf7" stroke="#253b36" stroke-width="1.6"/><text x="915.0" y="966.0" font-size="13" fill="#253b36" text-anchor="middle" font-weight="700" aria-label="Right lower face — 右侧面下部"><tspan x="915.0" dy="0" lang="en">Right lower face</tspan><tspan x="915.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">右侧面下部</tspan></text><path d="M790.0,856.0 L730.0,938.0" fill="none" stroke="#c69014" stroke-width="3" stroke-linecap="round" marker-end="url(#fig14-mc69014)"/><path d="M840.0,856.0 L910.0,938.0" fill="none" stroke="#c69014" stroke-width="3" stroke-linecap="round" marker-end="url(#fig14-mc69014)"/><path d="M1079,328 l52,24 m0,-24 l-52,24" stroke="#3f6f8f" stroke-width="5" stroke-linecap="round"/><circle cx="1157.0" cy="340.0" r="15" fill="#3f6f8f" stroke="#fff" stroke-width="2"/><text x="1157.0" y="345.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="700" lang="en">A</text><path d="M789,718 l52,24 m0,-24 l-52,24" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/><circle cx="867.0" cy="730.0" r="15" fill="#c0392b" stroke="#fff" stroke-width="2"/><text x="867.0" y="735.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="700" lang="en">B</text><text x="1120.0" y="560.0" font-size="13" fill="#6b6458" text-anchor="start" font-weight="600" aria-label="The upper part receives fibres from both sides — 核上部接受双侧皮质的纤维"><tspan x="1120.0" dy="0" lang="en">The upper part receives fibres from both sides</tspan><tspan x="1120.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">核上部接受双侧皮质的纤维</tspan></text><text x="1120.0" y="640.0" font-size="13" fill="#6b6458" text-anchor="start" font-weight="600" aria-label="The lower part receives fibres from the opposite side only — 核下部只接受对侧皮质的纤维"><tspan x="1120.0" dy="0" lang="en">The lower part receives fibres from the opposite side only</tspan><tspan x="1120.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">核下部只接受对侧皮质的纤维</tspan></text><text x="300.0" y="150.0" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700" aria-label="B. Peripheral palsy (nerve or nucleus) — B. 周围性面瘫（面神经或面神经核）"><tspan x="300.0" dy="0" lang="en">B. Peripheral palsy (nerve or nucleus)</tspan><tspan x="300.0" dy="21" lang="zh-CN" font-size="15" font-weight="400" fill="#68726a">B. 周围性面瘫（面神经或面神经核）</tspan></text><ellipse cx="300" cy="460" rx="150.0" ry="200.0" fill="#f7efe2" stroke="#b7ab95" stroke-width="2"/><path d="M300.0,260.0 A150.0,200.0 0 0 0 150.0,460.0 L300.0,460.0 Z" fill="#c0392b" fill-opacity=".22"/><path d="M150.0,460.0 A150.0,200.0 0 0 0 300.0,660.0 L300.0,460.0 Z" fill="#c0392b" fill-opacity=".22"/><path d="M300.0,260.0 L300.0,660.0" stroke="#b7ab95" stroke-width="1" stroke-dasharray="4 5"/><path d="M318.0,310.0 q45.0,-8.0 90.0,0" fill="none" stroke="#6b6458" stroke-width="1.6"/><path d="M318.0,328.0 q45.0,-8.0 90.0,0" fill="none" stroke="#6b6458" stroke-width="1.6"/><path d="M318.0,346.0 q45.0,-8.0 90.0,0" fill="none" stroke="#6b6458" stroke-width="1.6"/><path d="M325.0,372.0 q38.0,-16.0 78.0,0" fill="none" stroke="#253b36" stroke-width="4" stroke-linecap="round"/><path d="M275.0,390.0 q-38.0,-4.0 -78.0,0" fill="none" stroke="#253b36" stroke-width="4" stroke-linecap="round"/><ellipse cx="362.0" cy="415.0" rx="26.0" ry="9.0" fill="#fff" stroke="#253b36" stroke-width="1.6"/><circle cx="362.0" cy="415.0" r="7.0" fill="#253b36"/><ellipse cx="238.0" cy="415.0" rx="26.0" ry="15.0" fill="#fff" stroke="#253b36" stroke-width="1.6"/><circle cx="238.0" cy="415.0" r="7.0" fill="#253b36"/><path d="M300.0,430.0 L286.0,500.0 L310.0,504.0" fill="none" stroke="#6b6458" stroke-width="1.8"/><path d="M242.0,584.0 Q290.0,572.0 362.0,552.0" fill="none" stroke="#253b36" stroke-width="4" stroke-linecap="round"/><path d="M340.0,520.0 q22.0,20.0 30.0,48.0" fill="none" stroke="#6b6458" stroke-width="1.4"/><text x="150.0" y="692.0" font-size="13" fill="#6b6458" text-anchor="start" font-weight="600" aria-label="Patient&#x27;s right — 患者右侧"><tspan x="150.0" dy="0" lang="en">Patient&#x27;s right</tspan><tspan x="150.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">患者右侧</tspan></text><text x="450.0" y="692.0" font-size="13" fill="#6b6458" text-anchor="end" font-weight="600" aria-label="Patient&#x27;s left — 患者左侧"><tspan x="450.0" dy="0" lang="en">Patient&#x27;s left</tspan><tspan x="450.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">患者左侧</tspan></text><rect x="60" y="760" width="480" height="140" rx="8" fill="#fffdf7" stroke="#c0392b" stroke-width="1.6"/><text x="74.0" y="784.0" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700" aria-label="Forehead involved — 前额受累"><tspan x="74.0" dy="0" lang="en">Forehead involved</tspan><tspan x="74.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">前额受累</tspan></text><text x="74.0" y="828.0" font-size="13" fill="#253b36" text-anchor="start" font-weight="600" lang="en">Same side as the lesion. The whole half of the face is weak: the</text><text x="74.0" y="847.0" font-size="13" fill="#253b36" text-anchor="start" font-weight="600" lang="en">forehead does not wrinkle, the eye does not close and the corner</text><text x="74.0" y="866.0" font-size="13" fill="#253b36" text-anchor="start" font-weight="600" lang="en">of the mouth droops.</text><text x="74.0" y="885.0" font-size="12" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">与病变同侧。半侧面部全部无力：不能皱额，闭不上眼，口角下垂。</text><text x="1600.0" y="150.0" font-size="17" fill="#3f6f8f" text-anchor="middle" font-weight="700" aria-label="A. Central palsy (above the nucleus) — A. 中枢性面瘫（面神经核以上）"><tspan x="1600.0" dy="0" lang="en">A. Central palsy (above the nucleus)</tspan><tspan x="1600.0" dy="21" lang="zh-CN" font-size="15" font-weight="400" fill="#68726a">A. 中枢性面瘫（面神经核以上）</tspan></text><ellipse cx="1600" cy="460" rx="150.0" ry="200.0" fill="#f7efe2" stroke="#b7ab95" stroke-width="2"/><path d="M1450.0,460.0 A150.0,200.0 0 0 0 1600.0,660.0 L1600.0,460.0 Z" fill="#c0392b" fill-opacity=".22"/><path d="M1600.0,260.0 L1600.0,660.0" stroke="#b7ab95" stroke-width="1" stroke-dasharray="4 5"/><path d="M1618.0,310.0 q45.0,-8.0 90.0,0" fill="none" stroke="#6b6458" stroke-width="1.6"/><path d="M1582.0,310.0 q-45.0,-8.0 -90.0,0" fill="none" stroke="#6b6458" stroke-width="1.6"/><path d="M1618.0,328.0 q45.0,-8.0 90.0,0" fill="none" stroke="#6b6458" stroke-width="1.6"/><path d="M1582.0,328.0 q-45.0,-8.0 -90.0,0" fill="none" stroke="#6b6458" stroke-width="1.6"/><path d="M1618.0,346.0 q45.0,-8.0 90.0,0" fill="none" stroke="#6b6458" stroke-width="1.6"/><path d="M1582.0,346.0 q-45.0,-8.0 -90.0,0" fill="none" stroke="#6b6458" stroke-width="1.6"/><path d="M1625.0,372.0 q38.0,-16.0 78.0,0" fill="none" stroke="#253b36" stroke-width="4" stroke-linecap="round"/><path d="M1575.0,372.0 q-38.0,-16.0 -78.0,0" fill="none" stroke="#253b36" stroke-width="4" stroke-linecap="round"/><ellipse cx="1662.0" cy="415.0" rx="26.0" ry="9.0" fill="#fff" stroke="#253b36" stroke-width="1.6"/><circle cx="1662.0" cy="415.0" r="7.0" fill="#253b36"/><ellipse cx="1538.0" cy="415.0" rx="26.0" ry="9.0" fill="#fff" stroke="#253b36" stroke-width="1.6"/><circle cx="1538.0" cy="415.0" r="7.0" fill="#253b36"/><path d="M1600.0,430.0 L1586.0,500.0 L1610.0,504.0" fill="none" stroke="#6b6458" stroke-width="1.8"/><path d="M1542.0,584.0 Q1590.0,572.0 1662.0,552.0" fill="none" stroke="#253b36" stroke-width="4" stroke-linecap="round"/><path d="M1640.0,520.0 q22.0,20.0 30.0,48.0" fill="none" stroke="#6b6458" stroke-width="1.4"/><text x="1450.0" y="692.0" font-size="13" fill="#6b6458" text-anchor="start" font-weight="600" aria-label="Patient&#x27;s right — 患者右侧"><tspan x="1450.0" dy="0" lang="en">Patient&#x27;s right</tspan><tspan x="1450.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">患者右侧</tspan></text><text x="1750.0" y="692.0" font-size="13" fill="#6b6458" text-anchor="end" font-weight="600" aria-label="Patient&#x27;s left — 患者左侧"><tspan x="1750.0" dy="0" lang="en">Patient&#x27;s left</tspan><tspan x="1750.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">患者左侧</tspan></text><rect x="1360" y="760" width="480" height="140" rx="8" fill="#fffdf7" stroke="#3f6f8f" stroke-width="1.6"/><text x="1374.0" y="784.0" font-size="15" fill="#3f6f8f" text-anchor="start" font-weight="700" aria-label="Forehead spared — 前额不受累"><tspan x="1374.0" dy="0" lang="en">Forehead spared</tspan><tspan x="1374.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">前额不受累</tspan></text><text x="1374.0" y="828.0" font-size="13" fill="#253b36" text-anchor="start" font-weight="600" lang="en">Opposite side to the lesion, for example a stroke. Only the lower</text><text x="1374.0" y="847.0" font-size="13" fill="#253b36" text-anchor="start" font-weight="600" lang="en">face is weak: the forehead still wrinkles and the eye still</text><text x="1374.0" y="866.0" font-size="13" fill="#253b36" text-anchor="start" font-weight="600" lang="en">closes.</text><text x="1374.0" y="885.0" font-size="12" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">在病变对侧，例如脑卒中。只有面下部无力：仍能皱额，仍能闭眼。</text><rect x="60" y="1040" width="1780" height="102" rx="8" fill="#fffdf7" stroke="#253b36" stroke-width="1.6"/><text x="74.0" y="1064.0" font-size="15" fill="#253b36" text-anchor="start" font-weight="700" aria-label="Bedside test — 床旁检查"><tspan x="74.0" dy="0" lang="en">Bedside test</tspan><tspan x="74.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">床旁检查</tspan></text><text x="74.0" y="1108.0" font-size="13" fill="#253b36" text-anchor="start" font-weight="600" lang="en">Ask the patient to raise the eyebrows, close the eyes tightly, show the teeth and puff out the cheeks. A spared forehead points to the brain and needs urgent assessment for stroke.</text><text x="74.0" y="1127.0" font-size="12" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">让患者抬眉、用力闭眼、示齿、鼓腮。前额不受累提示病变在脑内，需要按脑卒中紧急评估。</text><text class="fig-foot" x="38" y="1246" font-size="13" fill="#6b706a"><tspan x="38" dy="0" lang="en">Schematic; pathway and layers are simplified.</tspan><tspan x="38" dy="17" lang="zh-CN">解剖示意；走行与层次经过简化。</tspan></text></svg>