.7,472.6 917.8,471.6 924.8,471.3 C931.7,471.0 938.8,471.4 945.7,472.4 C952.6,473.4 959.5,475.2 966.1,477.5 C972.7,479.8 982.0,484.9 985.1,486.4" fill="none" stroke="#365e91" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M985.1,486.4 L1089.4,535.0" fill="none" stroke="#6b6257" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1116.6" cy="547.6" r="21" fill="#efe6d2" stroke="#6b6257" stroke-width="3"/><text x="850.0" y="820.0" font-size="14" fill="#253b36" text-anchor="middle" font-weight="700" aria-label="3. The pelvis tilts forward at the hips — 3. 骨盆在髋关节处前倾"><tspan x="850.0" dy="0" lang="en">3. The pelvis tilts forward at the hips</tspan><tspan x="850.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">3. 骨盆在髋关节处前倾</tspan></text><path d="M260,650 L380,650" fill="none" stroke="#2f4858" stroke-width="3" stroke-linecap="round" marker-end="url(#fig14-m2f4858)"/><path d="M590,650 L710,650" fill="none" stroke="#2f4858" stroke-width="3" stroke-linecap="round" marker-end="url(#fig14-m2f4858)"/><text x="560.0" y="880.0" font-size="14" fill="#2f4858" text-anchor="middle" font-weight="600" aria-label="Return to standing: the hips lead (posterior pelvic tilt by the hip extensors), then the lumbar spine extends. — 回到站立：髋部先动（伸髋肌使骨盆后倾），然后腰椎后伸。"><tspan x="560.0" dy="0" lang="en">Return to standing: the hips lead (posterior pelvic tilt by the hip extensors), then the lumbar spine extends.</tspan><tspan x="560.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">回到站立：髋部先动（伸髋肌使骨盆后倾），然后腰椎后伸。</tspan></text><text x="560.0" y="930.0" font-size="13" fill="#9a958a" text-anchor="middle" font-weight="400" aria-label="Going down, erector spinae and the hip extensors work eccentrically; coming up, the hip extensors start the posterior pelvic tilt, then erector spinae work concentrically. — 向下时竖脊肌和伸髋肌离心工作；向上时伸髋肌先启动骨盆后倾，随后竖脊肌向心工作。"><tspan x="560.0" dy="0" lang="en">Going down, erector spinae and the hip extensors work eccentrically; coming up, the hip extensors start the posterior pelvic tilt, then erector spinae work concentrically.</tspan><tspan x="560.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">向下时竖脊肌和伸髋肌离心工作；向上时伸髋肌先启动骨盆后倾，随后竖脊肌向心工作。</tspan></text><circle cx="1000.0" cy="250.0" r="13" fill="#365e91" stroke="#fff" stroke-width="2"/><text x="1000.0" y="254.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" lang="en">L</text><text x="1022.0" y="256.0" font-size="13" fill="#365e91" text-anchor="start" font-weight="700" aria-label="Lumbar spine — 腰椎"><tspan x="1022.0" dy="0" lang="en">Lumbar spine</tspan><tspan x="1022.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">腰椎</tspan></text><circle cx="1000.0" cy="300.0" r="13" fill="#9c3f6e" stroke="#fff" stroke-width="2"/><text x="1000.0" y="304.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" lang="en">P</text><text x="1022.0" y="306.0" font-size="13" fill="#9c3f6e" text-anchor="start" font-weight="700" aria-label="Pelvis — 骨盆"><tspan x="1022.0" dy="0" lang="en">Pelvis</tspan><tspan x="1022.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">骨盆</tspan></text><text x="1420.0" y="140.0" font-size="16" fill="#253b36" text-anchor="middle" font-weight="700" aria-label="B. Who switches on first (rapid arm movement) — B. 谁先激活（快速上肢运动）"><tspan x="1420.0" dy="0" lang="en">B. Who switches on first (rapid arm movement)</tspan><tspan x="1420.0" dy="20" lang="zh-CN" font-size="14" font-weight="400" fill="#68726a">B. 谁先激活（快速上肢运动）</tspan></text><path d="M1180,700 L1660,700" fill="none" stroke="#253b36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M1440,230 L1440,700" fill="none" stroke="#8c2f39" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" /><text x="1440.0" y="735.0" font-size="13" fill="#8c2f39" text-anchor="middle" font-weight="700" aria-label="Deltoid starts the arm movement — 三角肌启动上肢运动"><tspan x="1440.0" dy="0" lang="en">Deltoid starts the arm movement</tspan><tspan x="1440.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">三角肌启动上肢运动</tspan></text><text x="1180.0" y="735.0" font-size="12" fill="#9a958a" text-anchor="start" font-weight="400" aria-label="earlier — 更早"><tspan x="1180.0" dy="0" lang="en">earlier</tspan><tspan x="1180.0" dy="16" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">更早</tspan></text><text x="1660.0" y="735.0" font-size="12" fill="#9a958a" text-anchor="end" font-weight="400" aria-label="later — 更晚"><tspan x="1660.0" dy="0" lang="en">later</tspan><tspan x="1660.0" dy="16" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">更晚</tspan></text><text x="1180.0" y="280.0" font-size="13" fill="#2b6c7c" text-anchor="start" font-weight="700" aria-label="Transversus abdominis, healthy — 腹横肌，健康人"><tspan x="1180.0" dy="0" lang="en">Transversus abdominis, healthy</tspan><tspan x="1180.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">腹横肌，健康人</tspan></text><path d="M1330,330 L1660,330" fill="none" stroke="#2b6c7c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" /><circle cx="1330.0" cy="330.0" r="7" fill="#2b6c7c" stroke="#fff" stroke-width="2"/><text x="1180.0" y="410.0" font-size="13" fill="#7a8f9e" text-anchor="start" font-weight="700" aria-label="Other trunk muscles: onset varies — 其他躯干肌：激活时间不定"><tspan x="1180.0" dy="0" lang="en">Other trunk muscles: onset varies</tspan><tspan x="1180.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">其他躯干肌：激活时间不定</tspan></text><path d="M1360,460 L1520,460" fill="none" stroke="#7a8f9e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 4" opacity="0.8" /><text x="1180.0" y="540.0" font-size="13" fill="#b04a3a" text-anchor="start" font-weight="700" aria-label="Transversus abdominis, low back pain — 腹横肌，腰痛者"><tspan x="1180.0" dy="0" lang="en">Transversus abdominis, low back pain</tspan><tspan x="1180.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">腹横肌，腰痛者</tspan></text><path d="M1500,590 L1660,590" fill="none" stroke="#b04a3a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" /><circle cx="1500.0" cy="590.0" r="7" fill="#b04a3a" stroke="#fff" stroke-width="2"/><text x="1180.0" y="800.0" font-size="13" fill="#9a958a" text-anchor="start" font-weight="400" aria-label="Healthy: transversus abdominis came on before the deltoid in every direction. — 健康人：无论哪个方向，腹横肌都在三角肌之前激活。"><tspan x="1180.0" dy="0" lang="en">Healthy: transversus abdominis came on before the deltoid in every direction.</tspan><tspan x="1180.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">健康人：无论哪个方向，腹横肌都在三角肌之前激活。</tspan></text><text x="1180.0" y="838.0" font-size="13" fill="#9a958a" text-anchor="start" font-weight="400" aria-label="Low back pain: its onset was delayed. — 腰痛者：其激活延迟。"><tspan x="1180.0" dy="0" lang="en">Low back pain: its onset was delayed.</tspan><tspan x="1180.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">腰痛者：其激活延迟。</tspan></text><text class="fig-foot" x="38" y="1006" font-size="13" fill="#6b706a"><tspan x="38" dy="0" lang="en">Schematic; pathway and layers are simplified.</tspan><tspan x="38" dy="17" lang="zh-CN">解剖示意；走行与层次经过简化。</tspan></text></svg>