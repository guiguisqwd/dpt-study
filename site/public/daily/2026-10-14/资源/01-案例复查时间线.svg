<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-label="Teaching case: review points over 12 weeks of care — 教学案例：12 周保守治疗里的复查节点"><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style><defs></defs><rect width="100%" height="100%" fill="#fcfaf4"/><text class="fig-title" x="38" y="46" fill="#253b36" font-size="27" font-weight="700" aria-label="Teaching case: review points over 12 weeks of care — 教学案例：12 周保守治疗里的复查节点"><tspan x="38" dy="0" lang="en">Teaching case: review points over 12 weeks of care</tspan><tspan x="38" dy="32" lang="zh-CN" font-size="22" font-weight="400" fill="#68726a">教学案例：12 周保守治疗里的复查节点</tspan></text><rect x="30" y="106" width="330" height="130" rx="8" fill="#fff8e6" stroke="#c69014" stroke-width="1.8"/><text x="44.0" y="132.0" font-size="16" fill="#253b36" text-anchor="start" font-weight="700" lang="en">Week 0 · first visit</text><text x="44.0" y="154.0" font-size="15" fill="#253b36" text-anchor="start" font-weight="400" lang="en">Assess, explain, start exercise.</text><text x="44.0" y="176.0" font-size="15" fill="#253b36" text-anchor="start" font-weight="400" lang="en">No imaging is needed to start (BESS 2025).</text><text x="44.0" y="198.0" font-size="14" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">第 0 周 · 首诊：评估、解释、开始运动</text><text x="44.0" y="220.0" font-size="14" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">开始治疗不需要影像（BESS 2025）</text><rect x="378" y="106" width="330" height="130" rx="8" fill="#f1f7ef" stroke="#4f8a4a" stroke-width="1.8"/><text x="392.0" y="132.0" font-size="16" fill="#253b36" text-anchor="start" font-weight="700" lang="en">Symptoms past 6 weeks</text><text x="392.0" y="154.0" font-size="15" fill="#253b36" text-anchor="start" font-weight="400" lang="en">Take steps at work; ultrasound can rule</text><text x="392.0" y="176.0" font-size="15" fill="#253b36" text-anchor="start" font-weight="400" lang="en">out a cuff tear if indicated (Diercks 2014).</text><text x="392.0" y="198.0" font-size="14" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">症状超过 6 周：在工作上采取措施；</text><text x="392.0" y="220.0" font-size="14" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">必要时做超声排除肩袖撕裂</text><rect x="726" y="106" width="330" height="130" rx="8" fill="#fdf3e4" stroke="#b8730f" stroke-width="1.8"/><text x="740.0" y="132.0" font-size="16" fill="#253b36" text-anchor="start" font-weight="700" lang="en">No improvement by 6–8 weeks</text><text x="740.0" y="154.0" font-size="15" fill="#253b36" text-anchor="start" font-weight="400" lang="en">One subacromial steroid injection can</text><text x="740.0" y="176.0" font-size="15" fill="#253b36" text-anchor="start" font-weight="400" lang="en">be considered together (BESS 2025).</text><text x="740.0" y="198.0" font-size="14" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">6–8 周仍无改善：可以一起商量</text><text x="740.0" y="220.0" font-size="14" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">做一次肩峰下类固醇注射</text><rect x="1074" y="106" width="300" height="130" rx="8" fill="#eef3fa" stroke="#365e91" stroke-width="1.8"/><text x="1088.0" y="132.0" font-size="16" fill="#253b36" text-anchor="start" font-weight="700" lang="en">Every 2 weeks · review</text><text x="1088.0" y="154.0" font-size="15" fill="#253b36" text-anchor="start" font-weight="400" lang="en">Raise the load at each visit</text><text x="1088.0" y="176.0" font-size="15" fill="#253b36" text-anchor="start" font-weight="400" lang="en">(Holmgren 2012).</text><text x="1088.0" y="198.0" font-size="14" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">每 2 周复查一次，</text><text x="1088.0" y="220.0" font-size="14" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">每次复查时加负荷</text><path d="M150.0,236.0 L150.0,298.0" fill="none" stroke="#c69014" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M420.0,236.0 L420.0,300.0" fill="none" stroke="#4f8a4a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M780.0,236.0 L780.0,298.0" fill="none" stroke="#b8730f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><rect x="690" y="300" width="180" height="24" rx="6" fill="#f6dfb8" stroke="#b8730f" stroke-width="1.2"/><path d="M130,312 L1260,312" fill="none" stroke="#253b36" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M130,312 L1260,312" fill="none" stroke="#253b36" stroke-width="1.20" stroke-linecap="round" stroke-linejoin="round" opacity="0.32" transform="translate(1.4,1.0)"/><path d="M150.0,306.0 L150.0,318.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="150.0" y="342.0" font-size="15" fill="#253b36" text-anchor="middle" font-weight="700" lang="en">0</text><text x="150.0" y="364.0" font-size="13" fill="#6b706a" text-anchor="middle" font-weight="400" lang="en">3</text><path d="M240.0,306.0 L240.0,318.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="240.0" y="342.0" font-size="15" fill="#253b36" text-anchor="middle" font-weight="700" lang="en">1</text><text x="240.0" y="364.0" font-size="13" fill="#6b706a" text-anchor="middle" font-weight="400" lang="en">4</text><path d="M330.0,306.0 L330.0,318.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="330.0" y="342.0" font-size="15" fill="#253b36" text-anchor="middle" font-weight="700" lang="en">2</text><text x="330.0" y="364.0" font-size="13" fill="#6b706a" text-anchor="middle" font-weight="400" lang="en">5</text><path d="M420.0,306.0 L420.0,318.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="420.0" y="342.0" font-size="15" fill="#253b36" text-anchor="middle" font-weight="700" lang="en">3</text><text x="420.0" y="364.0" font-size="13" fill="#6b706a" text-anchor="middle" font-weight="400" lang="en">6</text><path d="M510.0,306.0 L510.0,318.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="510.0" y="342.0" font-size="15" fill="#253b36" text-anchor="middle" font-weight="700" lang="en">4</text><text x="510.0" y="364.0" font-size="13" fill="#6b706a" text-anchor="middle" font-weight="400" lang="en">7</text><path d="M600.0,306.0 L600.0,318.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="600.0" y="342.0" font-size="15" fill="#253b36" text-anchor="middle" font-weight="700" lang="en">5</text><text x="600.0" y="364.0" font-size="13" fill="#6b706a" text-anchor="middle" font-weight="400" lang="en">8</text><path d="M690.0,306.0 L690.0,318.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="690.0" y="342.0" font-size="15" fill="#253b36" text-anchor="middle" font-weight="700" lang="en">6</text><text x="690.0" y="364.0" font-size="13" fill="#6b706a" text-anchor="middle" font-weight="400" lang="en">9</text><path d="M780.0,306.0 L780.0,318.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="780.0" y="342.0" font-size="15" fill="#253b36" text-anchor="middle" font-weight="700" lang="en">7</text><text x="780.0" y="364.0" font-size="13" fill="#6b706a" text-anchor="middle" font-weight="400" lang="en">10</text><path d="M870.0,306.0 L870.0,318.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="870.0" y="342.0" font-size="15" fill="#253b36" text-anchor="middle" font-weight="700" lang="en">8</text><text x="870.0" y="364.0" font-size="13" fill="#6b706a" text-anchor="middle" font-weight="400" lang="en">11</text><path d="M960.0,306.0 L960.0,318.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="960.0" y="342.0" font-size="15" fill="#253b36" text-anchor="middle" font-weight="700" lang="en">9</text><text x="960.0" y="364.0" font-size="13" fill="#6b706a" text-anchor="middle" font-weight="400" lang="en">12</text><path d="M1050.0,306.0 L1050.0,318.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="1050.0" y="342.0" font-size="15" fill="#253b36" text-anchor="middle" font-weight="700" lang="en">10</text><text x="1050.0" y="364.0" font-size="13" fill="#6b706a" text-anchor="middle" font-weight="400" lang="en">13</text><path d="M1140.0,306.0 L1140.0,318.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="1140.0" y="342.0" font-size="15" fill="#253b36" text-anchor="middle" font-weight="700" lang="en">11</text><text x="1140.0" y="364.0" font-size="13" fill="#6b706a" text-anchor="middle" font-weight="400" lang="en">14</text><path d="M1230.0,306.0 L1230.0,318.0" fill="none" stroke="#253b36" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="1230.0" y="342.0" font-size="15" fill="#253b36" text-anchor="middle" font-weight="700" lang="en">12</text><text x="1230.0" y="364.0" font-size="13" fill="#6b706a" text-anchor="middle" font-weight="400" lang="en">15</text><circle cx="330.0" cy="312.0" r="8" fill="#365e91" stroke="#fff" stroke-width="2"/><circle cx="510.0" cy="312.0" r="8" fill="#365e91" stroke="#fff" stroke-width="2"/><circle cx="690.0" cy="312.0" r="8" fill="#365e91" stroke="#fff" stroke-width="2"/><circle cx="870.0" cy="312.0" r="8" fill="#365e91" stroke="#fff" stroke-width="2"/><circle cx="1050.0" cy="312.0" r="8" fill="#365e91" stroke="#fff" stroke-width="2"/><circle cx="1230.0" cy="312.0" r="8" fill="#365e91" stroke="#fff" stroke-width="2"/><circle cx="150.0" cy="312.0" r="12" fill="#c69014" stroke="#fff" stroke-width="2"/><circle cx="420.0" cy="312.0" r="9" fill="#4f8a4a" stroke="#fff" stroke-width="2"/><circle cx="1230.0" cy="312.0" r="12" fill="#b94334" stroke="#fff" stroke-width="2"/><text x="1274.0" y="342.0" font-size="13" fill="#253b36" text-anchor="start" font-weight="700" lang="en">weeks of care</text><text x="1274.0" y="364.0" font-size="13" fill="#6b706a" text-anchor="start" font-weight="400" lang="en">since pain began</text><text x="30.0" y="342.0" font-size="13" fill="#253b36" text-anchor="start" font-weight="700" lang="zh-CN">治疗周数</text><text x="30.0" y="364.0" font-size="13" fill="#6b706a" text-anchor="start" font-weight="400" lang="zh-CN">发病周数</text><rect x="150" y="388" width="1080" height="64" rx="10" fill="#e3f0ee" stroke="#2b6c7c" stroke-width="1.6"/><text x="168.0" y="414.0" font-size="15" fill="#253b36" text-anchor="start" font-weight="600" lang="en">Home exercise once or twice a day · pain while exercising up to 5/10, settled before the next session (Holmgren 2012)</text><text x="168.0" y="438.0" font-size="14" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">每天在家练 1–2 次；练习时疼痛不超过 5/10，下次练习前要回落到练前水平（Holmgren 2012）</text><path d="M1230.0,454.0 L1230.0,484.0" fill="none" stroke="#b94334" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><rect x="764" y="484" width="610" height="112" rx="8" fill="#fbefed" stroke="#b94334" stroke-width="1.8"/><text x="778.0" y="510.0" font-size="16" fill="#253b36" text-anchor="start" font-weight="700" lang="en">Week 12 · no improvement: refer to secondary care (BESS 2025)</text><text x="778.0" y="533.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="en">Most exercise programmes show clinically significant change by 12 weeks (Littlewood 2015).</text><text x="778.0" y="556.0" font-size="14" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">第 12 周仍无改善：转专科（BESS 2025）</text><text x="778.0" y="579.0" font-size="14" fill="#68726a" text-anchor="start" font-weight="400" lang="zh-CN">多数运动方案在 12 周内应见到有临床意义的改善（Littlewood 2015）</text><text x="30.0" y="508.0" font-size="14" fill="#6b706a" text-anchor="start" font-weight="400" lang="en">The patient had pain for 3 weeks before the first visit.</text><text x="30.0" y="529.0" font-size="14" fill="#6b706a" text-anchor="start" font-weight="400" lang="en">BESS counts the 12 weeks as non-operative care; for</text><text x="30.0" y="550.0" font-size="14" fill="#6b706a" text-anchor="start" font-weight="400" lang="en">6–8 weeks it does not say where the count starts.</text><text x="30.0" y="571.0" font-size="14" fill="#6b706a" text-anchor="start" font-weight="400" lang="en">This figure counts both from the first visit.</text><text x="30.0" y="592.0" font-size="13" fill="#6b706a" text-anchor="start" font-weight="400" lang="zh-CN">病人首诊前已经痛了 3 周。BESS 的 12 周指保守治疗的时长；</text><text x="30.0" y="613.0" font-size="13" fill="#6b706a" text-anchor="start" font-weight="400" lang="zh-CN">6–8 周没有说从哪天算起。本图两者都从首诊算起。</text><text class="fig-foot" x="38" y="666" font-size="13" fill="#6b706a"><tspan x="38" dy="0" lang="en">Teaching case, not a real patient; time points from the sources named.</tspan><tspan x="38" dy="17" lang="zh-CN">教学案例，不是真实病人；时间点取自图中注明的来源。</tspan></text></svg>