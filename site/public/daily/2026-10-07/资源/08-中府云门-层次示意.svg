<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1300" height="700" viewBox="0 0 1300 700" role="img" aria-label="What lies beneath Zhongfu and Yunmen — 中府、云门深面有什么：层次示意"><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style><defs></defs><rect width="100%" height="100%" fill="#fcfaf4"/><text class="fig-title" x="38" y="46" fill="#253b36" font-size="27" font-weight="700" aria-label="What lies beneath Zhongfu and Yunmen — 中府、云门深面有什么：层次示意"><tspan x="38" dy="0" lang="en">What lies beneath Zhongfu and Yunmen</tspan><tspan x="38" dy="32" lang="zh-CN" font-size="22" font-weight="400" fill="#68726a">中府、云门深面有什么：层次示意</tspan></text><text x="38.0" y="116.0" font-size="14" fill="#b94334" text-anchor="start" font-weight="400" aria-label="Not to scale; layers only, not needling depth or direction. — 不按比例，只表示层次，不表示进针深度或方向。"><tspan x="38.0" dy="0" lang="en">Not to scale; layers only, not needling depth or direction.</tspan><tspan x="38.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">不按比例，只表示层次，不表示进针深度或方向。</tspan></text><text x="40.0" y="170.0" font-size="17" fill="#253b36" text-anchor="start" font-weight="600" aria-label="Zhongfu (LU1) · 1st intercostal space — 中府 · 第 1 肋间隙"><tspan x="40.0" dy="0" lang="en">Zhongfu (LU1) · 1st intercostal space</tspan><tspan x="40.0" dy="21" lang="zh-CN" font-size="15" font-weight="400" fill="#68726a">中府 · 第 1 肋间隙</tspan></text><rect x="40" y="206" width="560" height="34" fill="#f6e7da" stroke="#d8c3ae" stroke-width="1.2"/><text x="54.0" y="228.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="zh-CN">Skin 皮肤</text><rect x="40" y="240" width="560" height="40" fill="#fbf2e3" stroke="#e0d2b8" stroke-width="1.2"/><text x="54.0" y="265.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="zh-CN">Subcutaneous tissue 皮下组织</text><rect x="40" y="280" width="560" height="74" fill="#e9a596" stroke="#b94334" stroke-width="1.2"/><text x="54.0" y="322.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="zh-CN">Pectoralis major 胸大肌</text><rect x="40" y="354" width="560" height="60" fill="#d9b3a6" stroke="#8f4a3c" stroke-width="1.2"/><text x="54.0" y="389.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="zh-CN">Pectoralis minor 胸小肌</text><rect x="40" y="414" width="560" height="46" fill="#e2d5c0" stroke="#b9a888" stroke-width="1.2"/><text x="54.0" y="442.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="zh-CN">Intercostal muscles 肋间肌</text><rect x="40" y="460" width="560" height="24" fill="#f2c9c3" stroke="#b94334" stroke-width="1.2"/><text x="54.0" y="477.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="zh-CN">Pleura 胸膜</text><text x="588.0" y="477.0" font-size="13" fill="#b94334" text-anchor="end" font-weight="700" lang="zh-CN">危险层</text><rect x="40" y="484" width="560" height="90" fill="#f7d9d4" stroke="#b94334" stroke-width="1.2"/><text x="54.0" y="534.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="zh-CN">Lung 肺</text><text x="40.0" y="604.0" font-size="13" fill="#b94334" text-anchor="start" font-weight="600" aria-label="Danger: needling toward the midline can reach the pleura and lung. — 危险：向内深刺可能伤及胸膜和肺。"><tspan x="40.0" dy="0" lang="en">Danger: needling toward the midline can reach the pleura and lung.</tspan><tspan x="40.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">危险：向内深刺可能伤及胸膜和肺。</tspan></text><text x="690.0" y="170.0" font-size="17" fill="#253b36" text-anchor="start" font-weight="600" aria-label="Yunmen (LU2) · medial to the coracoid — 云门 · 喙突内缘"><tspan x="690.0" dy="0" lang="en">Yunmen (LU2) · medial to the coracoid</tspan><tspan x="690.0" dy="21" lang="zh-CN" font-size="15" font-weight="400" fill="#68726a">云门 · 喙突内缘</tspan></text><rect x="690" y="206" width="560" height="34" fill="#f6e7da" stroke="#d8c3ae" stroke-width="1.2"/><text x="704.0" y="228.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="zh-CN">Skin 皮肤</text><rect x="690" y="240" width="560" height="40" fill="#fbf2e3" stroke="#e0d2b8" stroke-width="1.2"/><text x="704.0" y="265.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="zh-CN">Subcutaneous tissue (cephalic vein nearby) 皮下组织（附近有头静脉）</text><rect x="690" y="280" width="560" height="60" fill="#efe1d0" stroke="#c9b296" stroke-width="1.2"/><text x="704.0" y="315.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="zh-CN">Deltopectoral groove 三角肌与胸大肌之间</text><rect x="690" y="340" width="560" height="30" fill="#e6dccb" stroke="#b9a888" stroke-width="1.2"/><text x="704.0" y="360.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="zh-CN">Clavipectoral fascia 锁胸筋膜</text><rect x="690" y="370" width="560" height="74" fill="#f1d48c" stroke="#c69014" stroke-width="1.2"/><text x="704.0" y="412.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="zh-CN">Axillary artery and vein, brachial plexus 腋动静脉、臂丛</text><text x="1238.0" y="412.0" font-size="13" fill="#b94334" text-anchor="end" font-weight="700" lang="zh-CN">神经血管</text><rect x="690" y="444" width="560" height="60" fill="#f2c9c3" stroke="#b94334" stroke-width="1.2"/><text x="704.0" y="479.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" lang="zh-CN">Toward the pleural apex (medially) 向内：靠近胸膜顶</text><text x="1238.0" y="479.0" font-size="13" fill="#b94334" text-anchor="end" font-weight="700" lang="zh-CN">危险方向</text><text x="690.0" y="534.0" font-size="13" fill="#b94334" text-anchor="start" font-weight="600" aria-label="Danger: the neurovascular bundle lies deep; the pleura lies medial. — 危险：深面是神经血管束，内侧靠近胸膜。"><tspan x="690.0" dy="0" lang="en">Danger: the neurovascular bundle lies deep; the pleura lies medial.</tspan><tspan x="690.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">危险：深面是神经血管束，内侧靠近胸膜。</tspan></text><text class="fig-foot" x="38" y="666" font-size="13" fill="#6b706a"><tspan x="38" dy="0" lang="en">Schematic; pathway and layers are simplified.</tspan><tspan x="38" dy="17" lang="zh-CN">解剖示意；走行与层次经过简化。</tspan></text></svg>