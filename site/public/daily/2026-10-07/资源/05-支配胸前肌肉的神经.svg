<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1300" height="820" viewBox="0 0 1300 820" role="img" aria-label="Brachial plexus: nerves to the pectoral muscles — 臂丛：支配胸前肌肉的神经"><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style><defs></defs><rect width="100%" height="100%" fill="#fcfaf4"/><text class="fig-title" x="38" y="46" fill="#253b36" font-size="27" font-weight="700" aria-label="Brachial plexus: nerves to the pectoral muscles — 臂丛：支配胸前肌肉的神经"><tspan x="38" dy="0" lang="en">Brachial plexus: nerves to the pectoral muscles</tspan><tspan x="38" dy="32" lang="zh-CN" font-size="22" font-weight="400" fill="#68726a">臂丛：支配胸前肌肉的神经</tspan></text><rect x="38" y="96" width="560" height="64" rx="8" fill="#eef3ec" stroke="#cfd8cc" stroke-width="1.6"/><text x="54.0" y="122.0" font-size="15" fill="#253b36" text-anchor="start" font-weight="700" lang="zh-CN">C = Cervical 颈部 · T = Thoracic 胸部</text><text x="54.0" y="146.0" font-size="13" fill="#444" text-anchor="start" font-weight="400" lang="zh-CN">Grey blocks are vertebrae (bones); lines are spinal nerves. 灰块为椎骨，线为脊神经。</text><path d="M95,195 L95,620" fill="none" stroke="#d9d2bf" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" /><rect x="62" y="206" width="86" height="48" rx="11" fill="#e6e1d3" stroke="#3A3A3A" stroke-width="1.8"/><text x="105.0" y="236.0" font-size="13" fill="#253b36" text-anchor="middle" font-weight="700" lang="en">C4 vertebra</text><rect x="62" y="276" width="86" height="48" rx="11" fill="#e6e1d3" stroke="#3A3A3A" stroke-width="1.8"/><text x="105.0" y="306.0" font-size="13" fill="#253b36" text-anchor="middle" font-weight="700" lang="en">C5 vertebra</text><rect x="62" y="346" width="86" height="48" rx="11" fill="#e6e1d3" stroke="#3A3A3A" stroke-width="1.8"/><text x="105.0" y="376.0" font-size="13" fill="#253b36" text-anchor="middle" font-weight="700" lang="en">C6 vertebra</text><rect x="62" y="416" width="86" height="48" rx="11" fill="#e6e1d3" stroke="#3A3A3A" stroke-width="1.8"/><text x="105.0" y="446.0" font-size="13" fill="#253b36" text-anchor="middle" font-weight="700" lang="en">C7 vertebra</text><rect x="62" y="486" width="86" height="48" rx="11" fill="#e6e1d3" stroke="#3A3A3A" stroke-width="1.8"/><text x="105.0" y="516.0" font-size="13" fill="#253b36" text-anchor="middle" font-weight="700" lang="en">T1 vertebra</text><rect x="62" y="556" width="86" height="48" rx="11" fill="#e6e1d3" stroke="#3A3A3A" stroke-width="1.8"/><text x="105.0" y="586.0" font-size="13" fill="#253b36" text-anchor="middle" font-weight="700" lang="en">T2 vertebra</text><text x="162.0" y="256.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="700" lang="en">C5 nerve</text><text x="162.0" y="326.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="700" lang="en">C6 nerve</text><text x="162.0" y="396.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="700" lang="en">C7 nerve</text><text x="162.0" y="466.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="700" lang="en">C8 nerve</text><text x="162.0" y="536.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="700" lang="en">T1 nerve</text><path d="M150,265 C260,265 300,300 430,300" fill="none" stroke="#365e91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M150,265 C260,265 300,300 430,300" fill="none" stroke="#365e91" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round" opacity="0.32" transform="translate(1.4,1.0)"/><path d="M150,335 C260,335 300,300 430,300" fill="none" stroke="#365e91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M150,335 C260,335 300,300 430,300" fill="none" stroke="#365e91" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round" opacity="0.32" transform="translate(1.4,1.0)"/><path d="M150,405 C260,405 300,405 430,405" fill="none" stroke="#9a958a" stroke-width="4" stroke-linecap="round" stroke-lin