0 720,330" fill="none" stroke="#b94334" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M430,300 L540,300 C620,300 640,330 720,330" fill="none" stroke="#b94334" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" opacity="0.32" transform="translate(1.4,1.0)"/><path d="M430,405 L540,405 C620,405 640,330 720,330" fill="none" stroke="#b94334" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M430,405 L540,405 C620,405 640,330 720,330" fill="none" stroke="#b94334" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" opacity="0.32" transform="translate(1.4,1.0)"/><path d="M430,300 L540,300 C620,300 640,420 720,420" fill="none" stroke="#9a958a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M430,300 L540,300 C620,300 640,420 720,420" fill="none" stroke="#9a958a" stroke-width="1.20" stroke-linecap="round" stroke-linejoin="round" opacity="0.32" transform="translate(1.4,1.0)"/><path d="M430,405 L540,405 C620,405 640,420 720,420" fill="none" stroke="#9a958a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M430,405 L540,405 C620,405 640,420 720,420" fill="none" stroke="#9a958a" stroke-width="1.20" stroke-linecap="round" stroke-linejoin="round" opacity="0.32" transform="translate(1.4,1.0)"/><path d="M430,510 L540,510 C620,510 640,420 720,420" fill="none" stroke="#9a958a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M430,510 L540,510 C620,510 640,420 720,420" fill="none" stroke="#9a958a" stroke-width="1.20" stroke-linecap="round" stroke-linejoin="round" opacity="0.32" transform="translate(1.4,1.0)"/><path d="M430,510 L540,510 C620,510 640,505 720,505" fill="none" stroke="#7a5aa6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M430,510 L540,510 C620,510 640,505 720,505" fill="none" stroke="#7a5aa6" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" opacity="0.32" transform="translate(1.4,1.0)"/><circle cx="720.0" cy="330.0" r="9" fill="#b94334" stroke="#fff" stroke-width="2"/><text x="734.0" y="358.0" font-size="13" fill="#b94334" text-anchor="start" font-weight="700" lang="zh-CN">Lateral cord 外侧束</text><circle cx="720.0" cy="420.0" r="9" fill="#9a958a" stroke="#fff" stroke-width="2"/><text x="734.0" y="446.0" font-size="13" fill="#9a958a" text-anchor="start" font-weight="700" lang="zh-CN">Posterior cord 后束</text><circle cx="720.0" cy="505.0" r="9" fill="#7a5aa6" stroke="#fff" stroke-width="2"/><text x="734.0" y="487.0" font-size="13" fill="#7a5aa6" text-anchor="start" font-weight="700" lang="zh-CN">Medial cord 内侧束</text><path d="M732,330 C780,300 800,270 850,262" fill="none" stroke="#b94334" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M732,330 C780,300 800,270 850,262" fill="none" stroke="#b94334" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round" opacity="0.32" transform="translate(1.4,1.0)"/><text x="858.0" y="258.0" font-size="15" fill="#b94334" text-anchor="start" font-weight="600" aria-label="Lateral pectoral n. (C5–C7) — 胸外侧神经 → 胸大肌（以锁骨部为主）"><tspan x="858.0" dy="0" lang="en">Lateral pectoral n. (C5–C7)</tspan><tspan x="858.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">胸外侧神经 → 胸大肌（以锁骨部为主）</tspan></text><path d="M732,505 C780,540 800,560 850,566" fill="none" stroke="#7a5aa6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M732,505 C780,540 800,560 850,566" fill="none" stroke="#7a5aa6" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round" opacity="0.32" transform="translate(1.4,1.0)"/><text x="858.0" y="562.0" font-size="15" fill="#7a5aa6" text-anchor="start" font-weight="600" aria-label="Medial pectoral n. (C8–T1) — 胸内侧神经 → 胸小肌 + 胸大肌胸肋部"><tspan x="858.0" dy="0" lang="en">Medial pectoral n. (C8–T1)</tspan><tspan x="858.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">胸内侧神经 → 胸小肌 + 胸大肌胸肋部</tspan></text><path d="M732,420 L850,420" fill="none" stroke="#9a958a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="858.0" y="425.0" font-size="13" fill="#777" text-anchor="start" font-weight="400" lang="zh-CN">Axillary, radial nn. … (shoulder chapter) 腋神经、桡神经等</text><path d="M445,300 C470,250 520,205 590,190" fill="none" stroke="#365e91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M445,300 C470,250 520,205 590,190" fill="none" stroke="#365e91" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round" opacity="0.32" transform="translate(1.4,1.0)"/><text x="598.0" y="186.0" font-size="15" fill="#365e91" text-anchor="start" font-weight="600" aria-label="Nerve to subclavius (C5–C6) — 锁骨下肌神经：由上干发出 → 锁骨下肌"><tspan x="598.0" dy="0" lang="en">Nerve to subclavius (C5–C6)</tspan><tspan x="598.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">锁骨下肌神经：由上干发出 → 锁骨下肌</tspan></text><text x="40.0" y="700.0" font-size="15" fill="#253b36" text-anchor="start" font-weight="600" aria-label="“Lateral” and “medial” pectoral nerves are named for the cords they leave, not for where they lie on the chest. — 胸外侧、胸内侧神经是按发出它们的“外侧束、内侧束”命名的，不是按它们在胸前的位置。"><tspan x="40.0" dy="0" lang="en">“Lateral” and “medial” pectoral nerves are named for the cords they leave, not for where they lie on the chest.</tspan><tspan x="40.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">胸外侧、胸内侧神经是按发出它们的“外侧束、内侧束”命名的，不是按它们在胸前的位置。</tspan></text><text class="fig-foot" x="38" y="786" font-size="13" fill="#6b706a"><tspan x="38" dy="0" lang="en">Schematic; pathway and layers are simplified.</tspan><tspan x="38" dy="17" lang="zh-CN">解剖示意；走行与层次经过简化。</tspan></text></svg>