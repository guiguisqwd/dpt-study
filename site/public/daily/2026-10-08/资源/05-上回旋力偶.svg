68726a">斜方肌下部：把冈根拉向下</tspan></text><path d="M140.0,670.8 L171.9,516.8" fill="none" stroke="#8f4a3c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="436.4" y="579.0" font-size="15" fill="#b4664d" text-anchor="start" font-weight="600" aria-label="Serratus anterior (lower part): — 前锯肌下部：把下角拉向外、向前"><tspan x="436.4" dy="0" lang="en">Serratus anterior (lower part):</tspan><tspan x="436.4" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">前锯肌下部：把下角拉向外、向前</tspan></text><text x="436.4" y="623.0" font-size="14" fill="#b4664d" text-anchor="start" font-weight="600" aria-label="pulls the inferior angle out and forward — "><tspan x="436.4" dy="0" lang="en">pulls the inferior angle out and forward</tspan><tspan x="436.4" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a"></tspan></text><path d="M243,568 A175,175 0 0 0 460,309" fill="none" stroke="#2b6c7c" stroke-width="4" stroke-linecap="round" marker-end="url(#fig05-m2b6c7c)"/><text x="518.4" y="317.1" font-size="16" fill="#2b6c7c" text-anchor="start" font-weight="600" aria-label="Result: upward rotation — 合力：上回旋（关节盂转向上）"><tspan x="518.4" dy="0" lang="en">Result: upward rotation</tspan><tspan x="518.4" dy="20" lang="zh-CN" font-size="14" font-weight="400" fill="#68726a">合力：上回旋（关节盂转向上）</tspan></text><text x="760.0" y="128.0" font-size="16" fill="#253b36" text-anchor="start" font-weight="600" aria-label="B · Who drives it during arm elevation — B · 抬臂过程中由谁主导（定性示意，不是肌电数值）"><tspan x="760.0" dy="0" lang="en">B · Who drives it during arm elevation</tspan><tspan x="760.0" dy="20" lang="zh-CN" font-size="14" font-weight="400" fill="#68726a">B · 抬臂过程中由谁主导（定性示意，不是肌电数值）</tspan></text><text x="760.0" y="214.0" font-size="13" fill="#b4664d" text-anchor="start" font-weight="700" lang="zh-CN">Serratus anterior 前锯肌</text><rect x="760" y="220" width="540" height="16" rx="5" fill="#b4664d" opacity="0.95"/><text x="760.0" y="270.0" font-size="13" fill="#b94334" text-anchor="start" font-weight="700" lang="zh-CN">Upper trapezius 斜方肌上部</text><rect x="760" y="276" width="270" height="16" rx="5" fill="#b94334" opacity="0.95"/><rect x="1030" y="276" width="270" height="16" rx="5" fill="#b94334" opacity="0.4"/><text x="760.0" y="326.0" font-size="13" fill="#8f4a3c" text-anchor="start" font-weight="700" lang="zh-CN">Lower trapezius 斜方肌下部</text><rect x="760" y="332" width="270" height="16" rx="5" fill="#8f4a3c" opacity="0.35"/><rect x="1030" y="332" width="270" height="16" rx="5" fill="#8f4a3c" opacity="0.95"/><text x="760.0" y="382.0" font-size="13" fill="#a0522d" text-anchor="start" font-weight="700" lang="zh-CN">Middle trapezius 斜方肌中部</text><rect x="760" y="388" width="540" height="16" rx="5" fill="#a0522d" opacity="0.45"/><path d="M760,470 L1300,470" fill="none" stroke="#253b36" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><path d="M760.0,464 L760.0,476" fill="none" stroke="#253b36" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="760.0" y="496.0" font-size="13" fill="#555" text-anchor="middle" font-weight="400" lang="en">0°</text><path d="M1030.0,464 L1030.0,476" fill="none" stroke="#253b36" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="1030.0" y="496.0" font-size="13" fill="#555" text-anchor="middle" font-weight="400" lang="en">90°</text><path d="M1300.0,464 L1300.0,476" fill="none" stroke="#253b36" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="1300.0" y="496.0" font-size="13" fill="#555" text-anchor="middle" font-weight="400" lang="en">180°</text><text x="1030.0" y="520.0" font-size="13" fill="#555" text-anchor="middle" font-weight="400" lang="zh-CN">Arm elevation · 上肢上举</text><text x="760.0" y="570.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" aria-label="Axis: near the SC joint early; it moves to the AC joint — 轴：早期在胸锁关节附近；肋锁韧带拉紧后"><tspan x="760.0" dy="0" lang="en">Axis: near the SC joint early; it moves to the AC joint</tspan><tspan x="760.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">轴：早期在胸锁关节附近；肋锁韧带拉紧后</tspan></text><text x="760.0" y="612.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" aria-label="once the costoclavicular ligament is taut. — 移到肩锁关节。"><tspan x="760.0" dy="0" lang="en">once the costoclavicular ligament is taut.</tspan><tspan x="760.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">移到肩锁关节。</tspan></text><text x="760.0" y="666.0" font-size="14" fill="#2b6c7c" text-anchor="start" font-weight="600" aria-label="Upper trapezius + SA early → lower trapezius + SA late. — 早期：斜方肌上部 + 前锯肌；后期：斜方肌下部 + 前锯肌。"><tspan x="760.0" dy="0" lang="en">Upper trapezius + SA early → lower trapezius + SA late.</tspan><tspan x="760.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">早期：斜方肌上部 + 前锯肌；后期：斜方肌下部 + 前锯肌。</tspan></text><text x="760.0" y="720.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" aria-label="Opposing downward rotators (levator scapulae, rhomboids) — 对抗的下回旋肌（肩胛提肌、菱形肌，明天学）"><tspan x="760.0" dy="0" lang="en">Opposing downward rotators (levator scapulae, rhomboids)</tspan><tspan x="760.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">对抗的下回旋肌（肩胛提肌、菱形肌，明天学）</tspan></text><text x="760.0" y="762.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" aria-label="lengthen under control. — 被控制地拉长。"><tspan x="760.0" dy="0" lang="en">lengthen under control.</tspan><tspan x="760.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">被控制地拉长。</tspan></text><text x="40.0" y="820.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="400" aria-label="Middle trapezius balances serratus protraction, so the scapula turns instead of sliding forward. — 斜方肌中部平衡前锯肌的前伸，让肩胛骨原地转动而不向前滑。"><tspan x="40.0" dy="0" lang="en">Middle trapezius balances serratus protraction, so the scapula turns instead of sliding forward.</tspan><tspan x="40.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">斜方肌中部平衡前锯肌的前伸，让肩胛骨原地转动而不向前滑。</tspan></text><text class="fig-foot" x="38" y="866" font-size="13" fill="#6b706a"><tspan x="38" dy="0" lang="en">Schematic; pathway and layers are simplified.</tspan><tspan x="38" dy="17" lang="zh-CN">解剖示意；走行与层次经过简化。</tspan></text></svg>