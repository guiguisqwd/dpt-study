que, 1.5 cun above the crease.</tspan><tspan x="40.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">指尖下的凹陷就是列缺（腕横纹上 1.5 寸）。</tspan></text><text x="1040.0" y="128.0" font-size="16" fill="#2b6c7c" text-anchor="middle" font-weight="600" aria-label="B · Jing-well points at the nail corner — B · 井穴：指甲根角旁 0.1 寸（右手背面观）"><tspan x="1040.0" dy="0" lang="en">B · Jing-well points at the nail corner</tspan><tspan x="1040.0" dy="20" lang="zh-CN" font-size="14" font-weight="400" fill="#68726a">B · 井穴：指甲根角旁 0.1 寸（右手背面观）</tspan></text><path d="M820,580 L820,280 C820,230 940,230 940,280 L940,580" fill="#fffaf1" stroke="#253b36" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M820,580 L820,280 C820,230 940,230 940,280 L940,580" fill="none" stroke="#253b36" stroke-width="1.10" stroke-linecap="round" stroke-linejoin="round" opacity="0.32" transform="translate(1.4,1.0)"/><path d="M838,370 L838,280 C838,260 922,260 922,280 L922,370 Z" fill="#f6eadb" stroke="#b9ab94" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><path d="M838,370 L838,280 C838,260 922,260 922,280 L922,370 Z" fill="none" stroke="#b9ab94" stroke-width="0.80" stroke-linecap="round" stroke-linejoin="round" opacity="0.32" transform="translate(1.4,1.0)"/><path d="M838,250 L838,440" fill="none" stroke="#7a8a9a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" /><path d="M798,370 L932,370" fill="none" stroke="#7a8a9a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" /><circle cx="829.0" cy="379.0" r="9" fill="#b94334" stroke="#fff" stroke-width="2.6"/><text x="880.0" y="620.0" font-size="14" fill="#253b36" text-anchor="middle" font-weight="700" lang="zh-CN">Thumb 拇指</text><rect x="800" y="640" width="180" height="34" rx="6" fill="#fff8f0" stroke="#b94334" stroke-width="1.4"/><text x="810.0" y="664.0" font-size="20" fill="#b94334" text-anchor="start" font-weight="700" lang="zh-CN"