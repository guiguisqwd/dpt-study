 1–8 肋外面（部分教材为 1–9）"><tspan x="38.0" dy="0" lang="en">O = Origin: outer surfaces of ribs 1–8</tspan><tspan x="38.0" dy="28" lang="zh-CN" font-size="20" font-weight="400" fill="#68726a">起点：第 1–8 肋外面（部分教材为 1–9）</tspan></text><text x="38.0" y="906.0" font-size="21" fill="#253b36" text-anchor="start" font-weight="600" aria-label="I = Insertion: costal surface of the medial border — 止点：肩胛骨内侧缘的肋面（上角 → 下角）"><tspan x="38.0" dy="0" lang="en">I = Insertion: costal surface of the medial border</tspan><tspan x="38.0" dy="28" lang="zh-CN" font-size="20" font-weight="400" fill="#68726a">止点：肩胛骨内侧缘的肋面（上角 → 下角）</tspan></text><text class="fig-foot" x="38" y="966" font-size="13" fill="#6b706a"><tspan x="38" dy="0" lang="en">Schematic; pathway and layers are simplified.</tspan><tspan x="38" dy="17" lang="zh-CN">解剖示意；走行与层次经过简化。</tspan></text></svg>