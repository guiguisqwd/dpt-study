="600" aria-label="Deltoid alone: the head rides up — 三角肌单独作用：肱骨头上移"><tspan x="400.0" dy="0" lang="en">Deltoid alone: the head rides up</tspan><tspan x="400.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">三角肌单独作用：肱骨头上移</tspan></text><path d="M280.0,402.0 L190.0,380.0" fill="none" stroke="#555" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="60.0" y="366.0" font-size="14" fill="#253b36" text-anchor="start" font-weight="600" aria-label="Acromion — 肩峰"><tspan x="60.0" dy="0" lang="en">Acromion</tspan><tspan x="60.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">肩峰</tspan></text><path d="M354.0,582.0 L250.0,520.0" fill="none" stroke="#555" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="40.0" y="478.0" font-size="15" fill="#365e91" text-anchor="start" font-weight="600" aria-label="Supraspinatus — 冈上肌"><tspan x="40.0" dy="0" lang="en">Supraspinatus</tspan><tspan x="40.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">冈上肌</tspan></text><text x="40.0" y="520.0" font-size="13" fill="#365e91" text-anchor="start" font-weight="400" aria-label="presses the head into the glenoid — 把肱骨头压向关节盂"><tspan x="40.0" dy="0" lang="en">presses the head into the glenoid</tspan><tspan x="40.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">把肱骨头压向关节盂</tspan></text><path d="M362.0,672.0 L260.0,804.0" fill="none" stroke="#555" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="40.0" y="822.0" font-size="15" fill="#365e91" text-anchor="start" font-weight="600" aria-label="Infraspinatus, teres minor, subscapularis — 冈下肌、小圆肌、肩胛下肌"><tspan x="40.0" dy="0" lang="en">Infraspinatus, teres minor, subscapularis</tspan><tspan x="40.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">冈下肌、小圆肌、肩胛下肌</tspan></text><text x="40.0" y="864.0" font-size="13" fill="#365e91" text-anchor="start" font-weight="400" aria-label="pull the head down and in — 把肱骨头往下、往内拉"><tspan x="40.0" dy="0" lang="en">pull the head down and in</tspan><tspan x="40.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">把肱骨头往下、往内拉</tspan></text><rect x="30" y="960" width="610" height="70" rx="10" fill="none" stroke="#b94334" stroke-width="1.6" stroke-dasharray="7 5"/><text x="50.0" y="990.0" font-size="15" fill="#253b36" text-anchor="start" font-weight="600" aria-label="Together: the arm rises and the head stays centred beneath the acromion — 合起来：手臂抬起，肱骨头仍居中，留在肩峰下方"><tspan x="50.0" dy="0" lang="en">Together: the arm rises and the head stays centred beneath the acromion</tspan><tspan x="50.0" dy="19" lang="zh-CN" font-size="13" font-weight="400" fill="#68726a">合起来：手臂抬起，肱骨头仍居中，留在肩峰下方</tspan></text><text x="690.0" y="196.0" font-size="20" fill="#253b36" text-anchor="start" font-weight="600" aria-label="Scapula: trapezius with serratus anterior — 肩胛骨：斜方肌与前锯肌"><tspan x="690.0" dy="0" lang="en">Scapula: trapezius with serratus anterior</tspan><tspan x="690.0" dy="26" lang="zh-CN" font-size="16" font-weight="400" fill="#68726a">肩胛骨：斜方肌与前锯肌</tspan></text><text x="690.0" y="256.0" font-size="14" fill="#6b706a" text-anchor="start" font-weight="400" aria-label="Right scapula from behind. Axis of rotation, as marked in the chapter&#x27;s figure 11: — 从后面看右肩胛骨。旋转轴（按章节图 11 的标注）："><tspan x="690.0" dy="0" lang="en">Right scapula from behind. Axis of rotation, as marked in the chapter&#x27;s figure 11:</tspan><tspan x="690.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">从后面看右肩胛骨。旋转轴（按章节图 11 的标注）：</tspan></text><text x="690.0" y="294.0" font-size="14" fill="#6b706a" text-anchor="start" font-weight="400" aria-label="(1) early, near the root of the spine; (2) later, at the acromioclavicular joint. — (1) 早期在肩胛冈根部附近；(2) 后期在肩锁关节。"><tspan x="690.0" dy="0" lang="en">(1) early, near the root of the spine; (2) later, at the acromioclavicular joint.</tspan><tspan x="690.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">(1) 早期在肩胛冈根部附近；(2) 后期在肩锁关节。</tspan></text><g transform="translate(960,450) scale(0.74)"><path d="M85,72 L292,63 Q300,74 308,64 L322,70 Q352,82 372,98 L384,140 L386,200 Q345,280 300,352 L172,598 Q140,540 118,480 L62,340 Q66,250 76,160 Z" fill="#fbf5e6" stroke="#3a3a3a" stroke-width="4.1"/><path d="M88,160 L252,118 L396,78 L408,96 L258,140 L92,180 Z" fill="#fbf5e6" stroke="#3a3a3a" stroke-width="4.1"/><path d="M392,72 Q470,42 542,56 Q556,72 542,86 Q470,96 406,100 Z" fill="#fbf5e6" stroke="#3a3a3a" stroke-width="4.1"/></g><path d="M1285.6,498.8 L1219.0,454.4" fill="none" stroke="#365e91" stroke-width="4.4" stroke-linecap="round" marker-end="url(#fig06-m365e91)"/><path d="M1031.0,583.2 L967.4,672.0" fill="none" stroke="#365e91" stroke-width="4.4" stroke-linecap="round" marker-end="url(#fig06-m365e91)"/><path d="M1090.2,888.1 L1211.6,898.4" fill="none" stroke="#365e91" stroke-width="4.4" stroke-linecap="round" marker-end="url(#fig06-m365e91)"/><path d="M1194,798 A200,200 0 0 0 1250,625" fill="none" stroke="#b94334" stroke-width="3.6" stroke-linecap="round" marker-end="url(#fig06-mb94334)"/><circle cx="1034" cy="576" r="13" fill="#fffaf0" stroke="#b94334" stroke-width="2.6"/><text x="1034.0" y="580.8" font-size="14" fill="#b94334" text-anchor="middle" font-weight="700" lang="en">1</text><circle cx="1256" cy="515" r="13" fill="#fffaf0" stroke="#b94334" stroke-width="2.6"/><text x="1256.0" y="520.1" font-size="14" fill="#b94334" text-anchor="middle" font-weight="700" lang="en">2</text><text x="1010.0" y="360.0" font-size="14" fill="#365e91" text-anchor="start" font-weight="600" aria-label="Upper trapezius (accessory nerve) — 上斜方肌（副神经）"><tspan x="1010.0" dy="0" lang="en">Upper trapezius (accessory nerve)</tspan><tspan x="1010.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">上斜方肌（副神经）</tspan></text><text x="1010.0" y="400.0" font-size="13" fill="#365e91" text-anchor="start" font-weight="400" aria-label="pulls the acromion and lateral clavicle up and in — 把肩峰和锁骨外端往上、往内拉"><tspan x="1010.0" dy="0" lang="en">pulls the acromion and lateral clavicle up and in</tspan><tspan x="1010.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">把肩峰和锁骨外端往上、往内拉</tspan></text><text x="690.0" y="660.0" font-size="14" fill="#365e91" text-anchor="start" font-weight="600" aria-label="Lower trapezius (accessory nerve) — 下斜方肌（副神经）"><tspan x="690.0" dy="0" lang="en">Lower trapezius (accessory nerve)</tspan><tspan x="690.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">下斜方肌（副神经）</tspan></text><text x="690.0" y="700.0" font-size="13" fill="#365e91" text-anchor="start" font-weight="400" aria-label="pulls the root of the spine down and in — 把肩胛冈根部往下、往内拉"><tspan x="690.0" dy="0" lang="en">pulls the root of the spine down and in</tspan><tspan x="690.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">把肩胛冈根部往下、往内拉</tspan></text><text x="940.0" y="960.0" font-size="14" fill="#365e91" text-anchor="start" font-weight="600" aria-label="Lower serratus anterior (long thoracic nerve) — 前锯肌下部（胸长神经）"><tspan x="940.0" dy="0" lang="en">Lower serratus anterior (long thoracic nerve)</tspan><tspan x="940.0" dy="18" lang="zh-CN" font-size="12" font-weight="400" fill="#68726a">前锯肌下部（胸长神经）</tspan></text><text x="940.0" y="1000.0" font-size="13" fill="#365e91" text-anchor="start" font-weight="400" aria-label="pulls the inferior angle out and forward — 把肩胛下角往外、往前拉"><tspan x="940.0" dy="0" lang="en">pulls the inferior angle out and forward</tspan><tspan x="940.0" dy="17" lang="zh-CN" font-size="11" font-weight="400" fill="#68726a">把肩胛下角往外、往前拉</tspan></text><text x="1252.2" y="761.2" font-size="16" fill="#b94334" text-anchor="start" font-weight="600" aria-label="Upward rotation — 上旋"><tspan x="1252.2" dy="0" lang="en">Upward rotation</tspan><tspan x="1252.2" dy="20" lang="zh-CN" font-size="14" font-weight="400" fill="#68726a">上旋</tspan></text><path d="M665,180 L665,1