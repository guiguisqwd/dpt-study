name: Check and publish anatomy study

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anatomy-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: library/shoulder/3d/package.json
          run_install: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: site/build/requirements-publish.txt

      - name: Install publication dependencies
        run: python -m pip install -r site/build/requirements-publish.txt

      - name: Install locked application dependencies
        working-directory: library/shoulder/3d
        run: pnpm install --frozen-lockfile

      - name: Rebuild and validate reading content and model links
        run: python library/shoulder/text/build-reading.py

      - name: Test topic scaffolding and publication requirements
        run: python -m unittest discover -s tests -v

      - name: Check geometric reference containment
        working-directory: library/shoulder/3d
        run: pnpm test:geometry

      - name: Check acupoint depth data against the model
        working-directory: library/shoulder/3d
        run: pnpm test:depth

      - name: Build the topic library, type-check and build the 3D application
        working-directory: library/shoulder/3d
        run: pnpm build

      - name: Read the configured Pages URL
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Prepare the public site and check links
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          # PRs exercise the same URL-rewriting path without deploying.
          site_url="${SITE_URL:-https://example.invalid/dpt-study/}"
          python site/build/prepare-web-release.py --site-url "$site_url"

      - name: Upload the complete Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website-release/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified build
        id: deployment
        uses: actions/deploy-pages@v4
